<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Steps 1–3 — topology map</title>
<script src="dc-lite.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0;background:#F7F6F2}
a{color:#2457D6}a:hover{color:#1A3F9E}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #15171C; background: #F7F6F2; min-height: 860px; padding: 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
    <h1 style="margin: 0; font-size: 20px">LLM proxy · architecture</h1>
    <div role="tablist" aria-label="Build step" style="display: flex; flex-wrap: wrap; gap: 4px; background: #E9E7E0; border-radius: 10px; padding: 4px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{s.selected}}" onClick="{{s.pick}}" style="border: none; border-radius: 8px; padding: 8px 14px; min-height: 40px; font-size: 14px; font-weight: 600; background: {{s.bg}}; color: #15171C">{{s.label}}</button>
      </sc-for>
    </div>
    <div style="margin-left: auto; display: flex; gap: 6px">
      <button type="button" onClick="{{prev}}" aria-label="Previous hop" style="border: 1px solid #CFCBC0; background: #FFFFFF; border-radius: 8px; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
      <button type="button" onClick="{{play}}" style="border: none; background: #15171C; color: #FFFFFF; border-radius: 8px; padding: 0 16px; height: 44px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>{{playLabel}}</button>
      <button type="button" onClick="{{next}}" aria-label="Next hop" style="border: 1px solid #CFCBC0; background: #FFFFFF; border-radius: 8px; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
    </div>
  </header>

  <p style="margin: 0; font-size: 14px; color: #4A4F5A">{{stepGoal}}</p>

  <div style="display: flex; flex-wrap: wrap; gap: 16px; flex: 1; align-items: flex-start">
    <!-- Diagram -->
    <section aria-label="Diagram" style="flex: 999 1 640px; min-width: 0; background: #FFFFFF; border: 1px solid #E2DFD6; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; align-items: center; gap: 12px; background: {{capBg}}; border-radius: 10px; padding: 10px 14px; min-height: 44px; box-sizing: border-box">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; color: #FFFFFF; background: #15171C; border-radius: 6px; padding: 3px 8px">{{hopCounter}}</span>
        <span style="font-size: 14px">{{caption}}</span>
      </div>

      <div style="display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding-bottom: 4px">
        <sc-for list="{{chain}}" as="n" hint-placeholder-count="5">
          <sc-if value="{{n.isNode}}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{n.pick}}" style="flex: 1 0 170px; text-align: left; border: 2px solid {{n.border}}; background: {{n.bg}}; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; color: #15171C; box-shadow: {{n.shadow}}">
              <span style="display: flex; align-items: center; gap: 8px">
                <span style="width: 10px; height: 10px; border-radius: 5px; background: {{n.color}}"></span>
                <span style="font-weight: 700; font-size: 16px">{{n.name}}</span>
              </span>
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #4A4F5A">{{n.where}}</span>
              <sc-for list="{{n.features}}" as="f" hint-placeholder-count="3">
                <span style="font-size: 13px; line-height: 1.4; display: flex; gap: 6px"><span style="color: {{n.color}}; font-weight: 700">·</span>{{f}}</span>
              </sc-for>
            </button>
          </sc-if>
          <sc-if value="{{n.isLink}}" hint-placeholder-val="{{ false }}">
            <div style="flex: 1 0 140px; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 0 6px">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{n.reqFg}}; text-align: center">{{n.req}}</span>
              <span style="position: relative; height: 3px; background: {{n.reqColor}}; border-radius: 2px"><span style="position: absolute; right: -2px; top: -5px; width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 9px solid {{n.reqColor}}"></span></span>
              <span style="position: relative; height: 3px; background: {{n.respColor}}; border-radius: 2px; margin-top: 8px"><span style="position: absolute; left: -2px; top: -5px; width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-right: 9px solid {{n.respColor}}"></span></span>
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{n.respFg}}; text-align: center">{{n.resp}}</span>
            </div>
          </sc-if>
        </sc-for>
      </div>

      <sc-if value="{{hasDb}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <span style="width: 3px; height: 34px; background: {{dbLink}}"></span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #4A4F5A">INSERT INTO calls (redacted)</span>
          <button type="button" onClick="{{db.pick}}" style="min-width: 260px; text-align: left; border: 2px solid {{db.border}}; background: {{db.bg}}; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px; color: #15171C; box-shadow: {{db.shadow}}">
            <span style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #8A4B00"></span><span style="font-weight: 700; font-size: 16px">Log DB</span></span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #4A4F5A">logs/proxy.db · SQLite</span>
            <span style="font-size: 13px">One row per call: time, agent, session, full request and response, usage, errors</span>
          </button>
        </div>
      </sc-if>
    </section>

    <!-- Entity detail -->
    <aside aria-label="Entity detail" style="flex: 1 1 400px; min-width: 300px; background: #FFFFFF; border: 1px solid #E2DFD6; border-radius: 14px; padding: 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: {{ent.color}}">{{ent.kicker}}</span>
      <h2 style="margin: 0; font-size: 20px">{{ent.name}}</h2>
      <p style="margin: 0; font-size: 14px; color: #4A4F5A; line-height: 1.5">{{ent.role}}</p>
      <div role="tablist" aria-label="Detail" style="display: flex; gap: 4px; background: #F1EFE9; border-radius: 8px; padding: 4px">
        <button type="button" role="tab" aria-selected="{{cfgSel}}" onClick="{{showCfg}}" style="flex: 1; border: none; border-radius: 6px; padding: 8px; min-height: 36px; font-weight: 600; font-size: 13px; background: {{cfgBg}}">Config</button>
        <button type="button" role="tab" aria-selected="{{codeSel}}" onClick="{{showCode}}" style="flex: 1; border: none; border-radius: 6px; padding: 8px; min-height: 36px; font-weight: 600; font-size: 13px; background: {{codeBg}}">Key code</button>
      </div>
      <sc-if value="{{isCfg}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{ent.config}}" as="c" hint-placeholder-count="4">
            <div style="border: 1px solid #ECE9E1; border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600">{{c.k}}</span>
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #2457D6; word-break: break-all">{{c.v}}</span>
              <span style="font-size: 12px; color: #4A4F5A">{{c.note}}</span>
            </div>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{isCode}}" hint-placeholder-val="{{ false }}">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #4A4F5A">{{ent.file}}</span>
        <div style="background: #15171C; border-radius: 8px; padding: 10px 0; overflow-x: auto; max-height: 470px; overflow-y: auto">
          <sc-for list="{{ent.code}}" as="l" hint-placeholder-count="12">
            <div style="display: flex; background: {{l.bg}}; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.6">
              <span style="flex: 0 0 34px; text-align: right; padding-right: 10px; color: #7D8594">{{l.n}}</span>
              <span style="flex: 0 0 14px; color: #7FE0B8">{{l.mark}}</span>
              <span style="white-space: pre; color: #E6E8EC; padding-right: 12px">{{l.t}}</span>
            </div>
          </sc-for>
        </div>
        <span style="font-size: 12px; color: #4A4F5A">+ marks lines added in this step</span>
      </sc-if>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"speedMs":{"editor":"range","default":1200,"min":400,"max":3000,"step":100,"unit":"ms"},"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 3, hop: -1, ent: 'agent', tab: 'cfg' };
    this.timer = null;
  }
  componentWillUnmount() { clearTimeout(this.timer); }
  hops(step) {
    if (step === 1) return [
      { link: 0, dir: 'req', actor: 'agent', text: 'Agent POSTs the conversation to OpenRouter with the real key (Bearer sk-or-…).' },
      { link: 0, dir: 'resp', actor: 'llm', text: 'OpenRouter answers: finish_reason=tool_calls, get_order(A-1001).' },
      { actor: 'agent', text: 'Agent runs get_order locally, appends the tool result and loops.' }
    ];
    const h = [
      { link: 0, dir: 'req', actor: 'agent', text: 'Agent POSTs to 127.0.0.1:8080/v1 with Bearer dummy and X-Agent-Id / X-Session-Id.' },
      { link: 1, dir: 'req', actor: 'proxy', text: 'Proxy drops the dummy key and X-* headers, adds the real key, forwards the body unchanged.' },
      { link: 1, dir: 'resp', actor: 'llm', text: 'OpenRouter answers the proxy (or returns an error status and body).' }
    ];
    if (step === 3) h.push({ db: true, actor: 'db', text: 'Proxy writes one row to logs/proxy.db: timing, ids, full request and response, secrets redacted.' });
    h.push({ link: 0, dir: 'resp', actor: 'proxy', text: 'Proxy returns status, headers and body to the agent exactly as received.' });
    h.push({ actor: 'agent', text: 'Agent runs the tool locally, appends the result and loops. The proxy never sees this step.' });
    return h;
  }
  code(lines, added) {
    return lines.split('\n').map((t, i) => ({ n: i + 1, t, mark: added.indexOf(i + 1) >= 0 ? '+' : '', bg: added.indexOf(i + 1) >= 0 ? '#16352A' : 'transparent' }));
  }
  entities(step) {
    const agentCode = step === 1
? `client = OpenAI(base_url=BASE_URL, api_key=API_KEY)
messages = [{"role": "system", "content": SYSTEM_PROMPT},
            {"role": "user", "content": GOAL}]

for turn in range(1, MAX_TURNS + 1):
    resp = client.chat.completions.create(
        model=MODEL, messages=messages, tools=TOOL_SPECS,
        extra_body={"reasoning": {"enabled": True}})
    msg = resp.choices[0].message
    messages.append(msg.model_dump(exclude_none=True))
    if not msg.tool_calls:
        print(f"final answer: {msg.content}")
        return 0
    for call in msg.tool_calls:
        args = json.loads(call.function.arguments or "{}")
        result = TOOLS[call.function.name](**args)
        messages.append({"role": "tool",
                         "tool_call_id": call.id, "content": result})`
: `session_id = uuid.uuid4().hex[:12]
client = OpenAI(base_url=BASE_URL, api_key=API_KEY, default_headers={
    "X-Agent-Id": os.environ.get("AGENT_ID", "agent-1"),
    "X-Session-Id": session_id})
messages = [{"role": "system", "content": SYSTEM_PROMPT},
            {"role": "user", "content": GOAL}]

for turn in range(1, MAX_TURNS + 1):
    resp = client.chat.completions.create(
        model=MODEL, messages=messages, tools=TOOL_SPECS,
        extra_body={"reasoning": {"enabled": True}})
    msg = resp.choices[0].message
    messages.append(msg.model_dump(exclude_none=True))
    if not msg.tool_calls:
        return 0
    for call in msg.tool_calls:
        result = TOOLS[call.function.name](**json.loads(call.function.arguments))
        messages.append({"role": "tool",
                         "tool_call_id": call.id, "content": result})`;
    const proxyCode =
`def _forward(self):
    path = self.path[3:] if self.path.startswith("/v1") else self.path
    body = self.rfile.read(int(self.headers.get("Content-Length") or 0))
    headers = {k: v for k, v in self.headers.items()
               if k.lower() not in SKIP_REQUEST}
    headers["Authorization"] = f"Bearer {REAL_KEY}"
    started = time.time()
    req = urllib.request.Request(UPSTREAM + path, data=body or None,
                                 headers=headers, method=self.command)
    try:
        with urllib.request.urlopen(req, timeout=300) as r:
            status, resp_headers, data = r.status, r.getheaders(), r.read()
    except urllib.error.HTTPError as e:  # provider errors pass through
        status, resp_headers, data = e.code, e.headers.items(), e.read()
    if LOGGING:
        log_call(started, int((time.time() - started) * 1000),
                 self.headers.get("X-Agent-Id"), self.headers.get("X-Session-Id"),
                 self.command, self.path, status, body, data)
    self.send_response(status)
    for k, v in resp_headers:
        if k.lower() not in SKIP_RESPONSE:
            self.send_header(k, v)
    self.wfile.write(data)`;
    const ents = {
      agent: { name: 'Agent', kicker: 'CLIENT', color: '#2457D6', where: 'python3 agent/agent.py', file: 'agent/agent.py',
        role: 'Holds a goal and system prompt, calls the LLM in a loop, runs tools locally and decides when it is done.',
        features: ['goal + system prompt', 'multi-turn loop, max turns', '5 local tools (get_order, …)'],
        config: step === 1
          ? [{ k: 'LLM_BASE_URL', v: 'https://openrouter.ai/api/v1', note: 'Talks to the provider directly' }, { k: 'LLM_API_KEY', v: 'sk-or-… (real key)', note: 'Falls back to OPENROUTER_API_KEY' }, { k: 'LLM_MODEL', v: 'nvidia/nemotron-3.5-super-vl:free', note: 'Swappable by config' }, { k: 'AGENT_GOAL', v: 'What will order A-1001 cost…', note: 'The task' }, { k: 'AGENT_MAX_TURNS', v: '8', note: 'Stops a runaway loop' }]
          : [{ k: 'LLM_BASE_URL', v: 'http://127.0.0.1:8080/v1', note: 'The only change: point at the proxy' }, { k: 'LLM_API_KEY', v: 'dummy', note: 'The agent never holds the real key' }, { k: 'LLM_MODEL', v: 'nvidia/nemotron-3.5-super-vl:free', note: 'Unchanged' }, { k: 'AGENT_ID', v: 'support-bot', note: 'Sent as X-Agent-Id' }, { k: 'X-Session-Id', v: 'uuid4()[:12] per run', note: 'Generated, not configured' }],
        code: this.code(agentCode, step === 3 ? [1, 2, 3, 4] : []) },
      proxy: { name: 'Proxy', kicker: 'INTERMEDIARY', color: '#6B3FB5', where: 'python3 proxy/proxy.py', file: 'proxy/proxy.py',
        role: 'Looks exactly like the provider to the agent. Holds the real key. In step 3 it also records every exchange.',
        features: step === 3 ? ['swap key, strip X-* headers', 'pass errors through', 'log each call (on/off)'] : ['swap key, strip X-* headers', 'pass errors through', 'no logging'],
        config: [{ k: 'OPENROUTER_API_KEY', v: 'sk-or-… (real key)', note: 'Only this process has it' }, { k: 'UPSTREAM_BASE_URL', v: 'https://openrouter.ai/api/v1', note: 'Where to forward' }, { k: 'PROXY_HOST / PROXY_PORT', v: '127.0.0.1 / 8080', note: 'Where the agent connects' }].concat(step === 3 ? [{ k: 'PROXY_LOGGING', v: 'on', note: 'off = step 2 pass-through' }, { k: 'PROXY_LOG_DB', v: 'logs/proxy.db', note: 'SQLite file' }] : [{ k: 'PROXY_LOGGING', v: 'off (default)', note: 'Nothing is recorded' }]),
        code: this.code(step === 3 ? proxyCode : proxyCode.split('\n').filter((l, i) => [6, 14, 15, 16, 17].indexOf(i) < 0).join('\n'), step === 3 ? [7, 15, 16, 17, 18] : []) },
      llm: { name: 'OpenRouter', kicker: 'LLM PROVIDER', color: '#0F6B4F', where: 'openrouter.ai/api/v1', file: 'POST /chat/completions (request shape)',
        role: 'OpenAI-compatible Chat Completions endpoint. Picks a provider for the model and returns a complete answer.',
        features: ['Chat Completions API', 'tool calling + reasoning', 'usage + provider in reply'],
        config: [{ k: 'endpoint', v: 'POST /api/v1/chat/completions', note: 'Non-streaming in steps 1–3' }, { k: 'model', v: 'nvidia/nemotron-3.5-super-vl:free', note: 'Free tier, daily limits' }, { k: 'Authorization', v: step === 1 ? 'Bearer sk-or-… from the agent' : 'Bearer sk-or-… from the proxy', note: 'Who holds the key' }],
        code: this.code(`{
  "model": "nvidia/nemotron-3.5-super-vl:free",
  "messages": [
    {"role": "system", "content": "You are a small autonomous agent…"},
    {"role": "user", "content": "A customer asks what they will pay…"}
  ],
  "tools": [{"type": "function", "function": {"name": "get_order", …}}],
  "reasoning": {"enabled": true}
}`, []) },
      db: { name: 'Log DB', kicker: 'STORE', color: '#8A4B00', where: 'logs/proxy.db', file: 'CREATE TABLE in proxy/proxy.py',
        role: 'A plain SQLite file. One row per call, readable with view_log.py or any SQLite tool.',
        features: [],
        config: [{ k: 'PROXY_LOG_DB', v: 'logs/proxy.db', note: 'Gitignored' }, { k: 'view sessions', v: 'python3 proxy/view_log.py', note: 'List' }, { k: 'view one', v: 'python3 proxy/view_log.py <session>', note: 'Turn by turn' }],
        code: this.code(`CREATE TABLE IF NOT EXISTS calls (
    id INTEGER PRIMARY KEY, ts TEXT, duration_ms INTEGER,
    agent TEXT, session TEXT,
    method TEXT, path TEXT, status INTEGER, model TEXT,
    finish_reason TEXT, usage TEXT, error TEXT,
    request TEXT, response TEXT)`, [1, 2, 3, 4, 5, 6, 7]) }
    };
    return ents;
  }
  go(step, hop) { this.setState({ hop }); }
  renderVals() {
    const { step, hop, ent, tab } = this.state;
    const speed = this.props.speedMs ?? 1200;
    const hops = this.hops(step);
    const cur = hop >= 0 ? hops[hop] : null;
    const ents = this.entities(step);
    const order = step === 1 ? ['agent', 'llm'] : ['agent', 'proxy', 'llm'];
    const linkLabels = step === 1
      ? [{ req: 'POST · Bearer sk-or-…', resp: '200 · full JSON answer' }]
      : [{ req: 'POST · Bearer dummy · X-Agent-Id', resp: 'same status + body' }, { req: 'POST · Bearer sk-or-… (real)', resp: '200 / 4xx · JSON' }];
    const chain = [];
    order.forEach((id, i) => {
      const e = ents[id];
      const active = cur && cur.actor === id;
      const selected = ent === id;
      chain.push({ isNode: true, isLink: false, name: e.name, where: e.where, color: e.color, features: e.features,
        border: selected ? e.color : '#E2DFD6', bg: active ? '#FFF7E0' : '#FFFFFF', shadow: active ? '0 0 0 4px #F5D58A' : 'none',
        pick: () => this.setState({ ent: id }) });
      if (i < order.length - 1) {
        const L = linkLabels[i];
        const reqOn = cur && cur.link === i && cur.dir === 'req';
        const respOn = cur && cur.link === i && cur.dir === 'resp';
        chain.push({ isNode: false, isLink: true, req: L.req, resp: L.resp,
          reqColor: reqOn ? '#D97706' : '#C9C5BA', respColor: respOn ? '#D97706' : '#C9C5BA',
          reqFg: reqOn ? '#15171C' : '#6B6F78', respFg: respOn ? '#15171C' : '#6B6F78' });
      }
    });
    const e = ents[ent] || ents.agent;
    const stepInfo = [
      { id: 1, label: 'Step 1 · Direct', goal: 'Prove the agent works on its own: agent → OpenRouter, real key in the agent.' },
      { id: 2, label: 'Step 2 · Pass-through', goal: 'Put the proxy in the path without changing what the agent experiences. Only the base URL and a dummy key change.' },
      { id: 3, label: 'Step 3 · Logging', goal: 'The proxy records every exchange so a whole conversation can be read back, turn by turn.' }
    ];
    const run = () => {
      clearTimeout(this.timer);
      const tick = i => { this.setState({ hop: i }); if (i < hops.length - 1) this.timer = setTimeout(() => tick(i + 1), speed); };
      tick(0);
    };
    return {
      steps: stepInfo.map(s => ({ label: s.label, selected: s.id === step ? 'true' : 'false', bg: s.id === step ? '#FFFFFF' : 'transparent',
        pick: () => { clearTimeout(this.timer); this.setState({ step: s.id, hop: -1, ent: (s.id === 1 && (ent === 'proxy' || ent === 'db')) ? 'agent' : ent }); } })),
      stepGoal: stepInfo[step - 1].goal,
      chain, hasDb: step === 3,
      dbLink: cur && cur.db ? '#D97706' : '#C9C5BA',
      db: { border: ent === 'db' ? '#8A4B00' : '#E2DFD6', bg: cur && cur.actor === 'db' ? '#FFF7E0' : '#FFFFFF', shadow: cur && cur.actor === 'db' ? '0 0 0 4px #F5D58A' : 'none', pick: () => this.setState({ ent: 'db' }) },
      caption: cur ? cur.text : 'Press Play to simulate one turn, or step through with the arrows. Click any box for its config and code.',
      hopCounter: cur ? (hop + 1) + ' / ' + hops.length : '— / ' + hops.length,
      capBg: cur ? '#FFF2CC' : '#F1EFE9',
      play: run, playLabel: hop >= 0 && hop < hops.length - 1 ? 'Restart' : 'Play turn',
      next: () => { clearTimeout(this.timer); this.setState({ hop: Math.min(hops.length - 1, hop + 1) }); },
      prev: () => { clearTimeout(this.timer); this.setState({ hop: Math.max(-1, hop - 1) }); },
      ent: e, isCfg: tab === 'cfg', isCode: tab === 'code',
      cfgSel: tab === 'cfg' ? 'true' : 'false', codeSel: tab === 'code' ? 'true' : 'false',
      cfgBg: tab === 'cfg' ? '#FFFFFF' : 'transparent', codeBg: tab === 'code' ? '#FFFFFF' : 'transparent',
      showCfg: () => this.setState({ tab: 'cfg' }), showCode: () => this.setState({ tab: 'code' })
    };
  }
}
</script>
</body>
