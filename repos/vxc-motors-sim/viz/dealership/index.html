<style>
/* Layout: full-bleed 3D canvas, HUD panels pinned to the corners, persona card slides in from the right.
   Single deliberate dark "control room" look so the HUD reads over any part of the scene. */
:root {
  --ink: #0e1218;
  --panel: rgba(14, 18, 24, 0.82);
  --panel-solid: #141a22;
  --line: rgba(160, 180, 205, 0.18);
  --fg: #e8edf3;
  --muted: #93a1b3;
  --accent: #3b8bea;
  --accent-ink: #ffffff;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --d-management: #d4a73a;
  --d-admin: #a08ad6;
  --d-sales: #3b8bea;
  --d-service: #27b3a8;
  --d-workshop: #e8843a;
  --d-parts: #78b85a;
  --d-customer: #a3acb8;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--ink); color: var(--fg); font: 15px/1.45 var(--body); overflow: hidden; }
#scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#scene.hovering { cursor: pointer; }
#scene.dragging { cursor: grabbing; }

.hud { position: fixed; z-index: 5; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; backdrop-filter: blur(6px); }
.brand {
  top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px));
  padding: 10px 14px; max-width: min(340px, calc(100vw - 24px));
}
.brand h1 { margin: 0; font: 700 26px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; }
.brand h1 span { color: var(--accent); }
.brand .sub { margin-top: 3px; font: 500 12px/1.3 var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.brand .zone { margin-top: 8px; font: 500 13px/1.2 var(--mono); color: var(--fg); }
.brand .zone b { color: var(--accent); font-weight: 500; }
.help { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
.help kbd { font: 500 11px/1 var(--mono); padding: 2px 5px; border: 1px solid var(--line); border-radius: 3px; color: var(--fg); background: rgba(255,255,255,0.04); }

.mapbox {
  top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px));
  padding: 8px;
}
.mapbox canvas { display: block; width: 240px; height: 180px; cursor: crosshair; border-radius: 3px; }
.maplabel { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; font: 600 12px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

.dock {
  left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; max-width: min(640px, calc(100vw - 24px));
}
button {
  font: 600 13px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); background: rgba(255,255,255,0.05); border: 1px solid var(--line);
  border-radius: 4px; padding: 8px 10px; cursor: pointer;
}
button:hover { background: rgba(255,255,255,0.12); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
button.on { border-color: var(--accent); color: var(--accent); }
.sep { width: 1px; background: var(--line); margin: 0 2px; }

.pad {
  right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding: 8px; display: none; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(2, 44px); gap: 6px;
}
.pad button { padding: 0; font-size: 18px; }
@media (pointer: coarse) { .pad { display: grid; } .help .keys { display: none; } }

#card {
  position: fixed; z-index: 8; top: 0; right: 0; height: 100%; width: min(420px, 100vw);
  background: var(--panel-solid); border-left: 1px solid var(--line);
  transform: translateX(105%); transition: transform 0.28s ease; overflow-y: auto;
  padding: calc(18px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 18px;
  box-sizing: border-box;
}
#card.open { transform: none; }
@media (prefers-reduced-motion: reduce) { #card { transition: none; } }
.card-top { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: center; }
.avatar { width: 112px; height: 112px; border-radius: 6px; background: #0b0f14; border: 1px solid var(--line); object-fit: cover; }
.card-top h2 { margin: 0; font: 700 28px/1.05 var(--display); letter-spacing: 0.02em; text-wrap: balance; }
.role { margin-top: 4px; color: var(--muted); font-size: 15px; }
.chip { display: inline-block; margin-top: 8px; font: 600 11px/1 var(--display); letter-spacing: 0.14em; text-transform: uppercase; padding: 4px 7px; border-radius: 3px; color: #0e1218; }
.summary { margin: 16px 0 0; font-size: 15.5px; }
dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 16px 0 0; font-size: 13.5px; }
dl.facts dt { font: 600 11px/1.6 var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
dl.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.profile { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14px; color: #c9d2dd; }
.profile h3, .profile h4 { font: 600 15px/1.2 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg); margin: 16px 0 6px; }
.profile ul { padding-left: 18px; margin: 6px 0; }
.profile p { margin: 6px 0; }
.card-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.close { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); padding: 6px 9px; }
.agentline { margin-top: 14px; font: 12px/1.4 var(--mono); color: var(--muted); }

#people {
  position: fixed; z-index: 7; left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(70px + env(safe-area-inset-bottom, 0px));
  width: min(360px, calc(100vw - 24px)); max-height: 55vh; overflow-y: auto; padding: 8px;
}
#people .row { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: center; width: 100%; text-align: left; text-transform: none; letter-spacing: 0; font: 500 14px/1.2 var(--body); padding: 6px; border-color: transparent; background: transparent; }
#people .row:hover { background: rgba(255,255,255,0.07); }
#people img { width: 36px; height: 36px; border-radius: 4px; }
#people small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.dept-head { font: 600 11px/1 var(--display); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); padding: 10px 6px 4px; }

#plan {
  position: fixed; inset: 0; z-index: 9; background: rgba(8, 11, 15, 0.94); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
#plan canvas { max-width: 100%; max-height: calc(100% - 90px); background: #0f141b; border: 1px solid var(--line); border-radius: 4px; cursor: crosshair; }
#plan .bar { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: center; }
#plan h2 { margin: 0; font: 700 22px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

#tip { position: fixed; z-index: 6; pointer-events: none; padding: 5px 8px; font: 500 12.5px/1.2 var(--body); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 4px; display: none; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; font: 600 16px var(--display); letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); z-index: 20; background: var(--ink); }

@media (max-width: 720px) {
  .mapbox canvas { width: 150px; height: 112px; }
  .brand { max-width: calc(100vw - 210px); }
  .brand .sub { font-size: 10.5px; letter-spacing: 0.08em; }
  .brand .help { display: none; }
  .brand h1 { font-size: 21px; }
}
</style>
</head>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

/* ------------------------------------------------------------------ data */

const DEPT_COLORS = {

  Workshop: "#e8843a", Parts: "#78b85a", Customer: "#a3acb8",

  } catch (e) { /* embedded copy is fine */ }

const CUSTOMERS = [
  { id: "cust-couple-a", name: "Walk-in couple", role: "Sales customers", department: "Customer", summary: "Comparing a BMW X3 and an i5 for the family. Talking finance options with the sales consultant.", scene: "Sales desk" },
  { id: "cust-couple-b", name: "Walk-in couple", role: "Sales customers", department: "Customer", summary: "Second half of the couple. Wants a test drive this Saturday.", scene: "Sales desk" },
  { id: "cust-m3", name: "Prospective buyer", role: "Sales customer", department: "Customer", summary: "Looking at the M3 Competition on the floor. Asking about delivery times from the factory.", scene: "Showroom floor" },
  { id: "cust-svc-1", name: "Service customer", role: "Service customer", department: "Customer", summary: "Dropping off a 320d for its annual service and a brake-pad warning.", scene: "Service desk" },
  { id: "cust-svc-2", name: "Service customer", role: "Service customer", department: "Customer", summary: "Collecting an iX after a software update. Querying the invoice.", scene: "Service desk" },
  { id: "cust-lounge", name: "Waiting customer", role: "Service customer", department: "Customer", summary: "Waiting in the lounge while the workshop finishes a tyre change.", scene: "Customer lounge" },
  { id: "cust-reception", name: "Visitor", role: "Walk-in visitor", department: "Customer", summary: "Asking reception where to collect a parts order.", scene: "Reception" },
];

/* ------------------------------------------------------------------ renderer */

const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color("#b9cbdc");

sun.position.set(-30, 50, -40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 140 });
sun.shadow.bias = -0.0005;
scene.add(sun);

/* ------------------------------------------------------------------ helpers */

const colliders = [];          // axis-aligned boxes in the xz plane
const pickables = [];          // meshes that open a persona card
const animated = [];           // callbacks run each frame
const RAISED = [];             // cars up on a lift

function mat(color, opts = {}) { return new THREE.MeshStandardMaterial({ color, roughness: 0.75, metalness: 0.0, ...opts }); }

function box(w, h, d, material, x, y, z, { cast = false, receive = true, solid = false, parent = scene } = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x, y, z);
  m.castShadow = cast; m.receiveShadow = receive;
  parent.add(m);
  if (solid) colliders.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2 });
  return m;
}

function addCollider(x, z, w, d) { colliders.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2 }); }

function canvasTexture(w, h, draw) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

function sign(text, { w = 4, h = 0.7, bg = "#141a22", fg = "#e8edf3", accent = null, font = "700 120px 'Barlow Condensed', 'Arial Narrow', sans-serif" } = {}) {
  const px = 1024, py = Math.round(px * h / w);
  const tex = canvasTexture(px, py, (g) => {
    g.fillStyle = bg; g.fillRect(0, 0, px, py);
    if (accent) { g.fillStyle = accent; g.fillRect(0, py - 10, px, 10); }
    g.fillStyle = fg; g.font = font; g.textAlign = "center"; g.textBaseline = "middle";
    let size = parseInt(font.match(/(\d+)px/)[1], 10);
    while (size > 10) { g.font = font.replace(/\d+px/, size + "px"); if (g.measureText(text).width < px * 0.9 && size < py * 0.8) break; size -= 4; }
    g.fillText(text, px / 2, py / 2 + 4);
  });
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
}

function hashCode(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

/* ------------------------------------------------------------------ materials */

const M = {
  wall: mat("#e9e6e0"),
  wallDark: mat("#3a4048"),
  glass: new THREE.MeshPhysicalMaterial({ color: "#bcd6ea", transparent: true, opacity: 0.22, roughness: 0.05, metalness: 0.1, depthWrite: false }),
  mullion: mat("#2b3138", { metalness: 0.6, roughness: 0.4 }),
  desk: mat("#f2f2f0", { roughness: 0.4 }),
  deskTop: mat("#1d2228", { roughness: 0.35 }),
  wood: mat("#8a6a4a", { roughness: 0.6 }),
  sofa: mat("#2c3440"),

  black: mat("#16191d", { roughness: 0.5 }),
  tyre: mat("#151515", { roughness: 0.9 }),
  lift: mat("#d9b31f", { roughness: 0.5 }),
  red: mat("#b8282e", { roughness: 0.45 }),
  shelf: mat("#59626d", { metalness: 0.4 }),
  box: mat("#c49a64"),
  plant: mat("#3f7a45"),
  pot: mat("#e0ddd5"),
  screen: new THREE.MeshStandardMaterial({ color: "#0b1622", emissive: "#2a5d95", emissiveIntensity: 0.6 }),
  light: new THREE.MeshBasicMaterial({ color: "#fdfcf6" }),
  ceiling: new THREE.MeshStandardMaterial({ color: "#f3f2ee", roughness: 0.9, emissive: "#e9e7e1", emissiveIntensity: 0.55 }),
};

/* ------------------------------------------------------------------ ground & floors */

const asphalt = canvasTexture(512, 512, (g, w, h) => {
  g.fillStyle = "#4a4d52"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 6000; i++) { g.fillStyle = `rgba(${200 + Math.random() * 55 | 0},${200 + Math.random() * 55 | 0},${200 + Math.random() * 55 | 0},${Math.random() * 0.06})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
});
asphalt.wrapS = asphalt.wrapT = THREE.RepeatWrapping; asphalt.repeat.set(20, 20);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(220, 220), new THREE.MeshStandardMaterial({ map: asphalt, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// grass verges and the street
const grass = mat("#5f8a4e", { roughness: 1 });
for (const [x, z, w, d] of [[-70, 0, 60, 120], [70, 0, 60, 120], [0, 50, 200, 30]]) {
  const g = new THREE.Mesh(new THREE.PlaneGeometry(w, d), grass); g.rotation.x = -Math.PI / 2; g.position.set(x, 0.01, z); g.receiveShadow = true; scene.add(g);
}
const road = new THREE.Mesh(new THREE.PlaneGeometry(220, 12), mat("#2f3236", { roughness: 0.9 }));
road.rotation.x = -Math.PI / 2; road.position.set(0, 0.015, -46); scene.add(road);
for (let x = -100; x < 100; x += 8) box(4, 0.01, 0.2, mat("#e8e2c8"), x, 0.025, -46);
box(220, 0.15, 3, mat("#b7b4ad"), 0, 0.075, -38.5, { receive: true }); // pavement
// parking bays
for (let x = -28; x <= 28; x += 3.2) box(0.12, 0.01, 5, mat("#f2efe6"), x, 0.02, -30);

const tiles = canvasTexture(512, 512, (g, w, h) => {
  g.fillStyle = "#d9d8d4"; g.fillRect(0, 0, w, h);
  g.strokeStyle = "#c2c0bb"; g.lineWidth = 3;
  for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(i * w / 4, 0); g.lineTo(i * w / 4, h); g.stroke(); g.beginPath(); g.moveTo(0, i * h / 4); g.lineTo(w, i * h / 4); g.stroke(); }
});
tiles.wrapS = tiles.wrapT = THREE.RepeatWrapping;

function floor(x1, z1, x2, z2, material, repeat = 1) {
  const w = x2 - x1, d = z2 - z1;
  const m = material.clone();
  if (m.map) { m.map = m.map.clone(); m.map.needsUpdate = true; m.map.repeat.set(w / (4 * repeat), d / (4 * repeat)); }
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, d), m);
  p.rotation.x = -Math.PI / 2; p.position.set((x1 + x2) / 2, 0.03, (z1 + z2) / 2); p.receiveShadow = true; scene.add(p);
}
const showroomFloor = new THREE.MeshStandardMaterial({ map: tiles, roughness: 0.18, metalness: 0.05 });
floor(-30, -20, 30, 0, showroomFloor);                                   // showroom + service reception
floor(-30, 0, 30, 4, mat("#c9c6bf", { roughness: 0.6 }));                 // corridor
floor(-30, 4, -16, 20, mat("#6e7682", { roughness: 0.95 }));              // offices (carpet)
floor(-16, 4, 0, 20, mat("#8b8f94", { roughness: 0.8 }));                 // parts store
floor(0, 4, 30, 20, mat("#5b6168", { roughness: 0.55, metalness: 0.05 })); // workshop epoxy

/* ------------------------------------------------------------------ walls */

const H = 4.5;
function wall(x1, z1, x2, z2, { gaps = [], glass = false, h = H, door = 2.6, t = 0.2, material = M.wall } = {}) {
  const alongX = z1 === z2;
  const a0 = alongX ? Math.min(x1, x2) : Math.min(z1, z2);
  const a1 = alongX ? Math.max(x1, x2) : Math.max(z1, z2);
  const fixed = alongX ? z1 : x1;
  const sorted = [...gaps].sort((p, q) => p[0] - q[0]);
  const segs = []; let cur = a0;
  for (const [g0, g1] of sorted) { if (g0 > cur) segs.push([cur, g0]); cur = Math.max(cur, g1); }
  if (cur < a1) segs.push([cur, a1]);
  const place = (s0, s1, y0, y1, m, solid) => {
    const len = s1 - s0, mid = (s0 + s1) / 2, hh = y1 - y0;
    const [w, d, x, z] = alongX ? [len, t, mid, fixed] : [t, len, fixed, mid];
    const mesh = box(w, hh, d, m, x, y0 + hh / 2, z, { solid });
    if (m === M.glass) mesh.renderOrder = 2;
    return mesh;
  };
  for (const [s0, s1] of segs) {
    if (glass) {
      place(s0, s1, 0, h, M.glass, true);
      const n = Math.max(1, Math.round((s1 - s0) / 3));
      for (let i = 0; i <= n; i++) {
        const p = s0 + (i * (s1 - s0)) / n;
        alongX ? box(0.08, h, 0.24, M.mullion, p, h / 2, fixed) : box(0.24, h, 0.08, M.mullion, fixed, h / 2, p);
      }
      place(s0, s1, h - 0.12, h, M.mullion, false);
      place(s0, s1, 0, 0.1, M.mullion, false);
    } else {
      place(s0, s1, 0, h, material, true);
    }
  }
  // a gap is [from, to, lintel height, sill height]; a sill turns a doorway into a hatch
  for (const [g0, g1, top = door, sill = 0] of sorted) {
    place(g0, g1, top, h, glass ? M.mullion : material, false);
    if (sill) place(g0, g1, 0, sill, material, true);
  }
}

// Workstation slots, keyed by the persona `workspace` field. `hint` picks the
// managers' desks first; everyone else fills the remaining slots in order.
const SLOTS = {
  "gm-office":     [{ x: -23, z: 16.6, look: [-23, 10] }],
  "reception":     [{ x: -2, z: -14.6, look: [-2, -20] }],
  "back-office":   [{ x: -23, z: 8.6, look: [-23, 4] }],
  "sales-office":  [{ x: 4, z: -2.4, look: [4, -6] }],
  "showroom":      [{ x: -12, z: -3.4, look: [-12, -6] }, { x: 1.0, z: -9.8, look: [2.4, -10.6] }],
  "service-desk":  [{ x: 26, z: -2.4, look: [26, -6], hint: /manager/i }, { x: 15, z: -7.1, look: [15, -10] }, { x: 21, z: -7.1, look: [21, -10] }],
  "workshop":      [{ x: 3.2, z: 9.6, look: [3.2, 12] }, { x: 9.5, z: 9.6, look: [10.4, 8.6] }],
  "parts-counter": [{ x: -2.1, z: 7.5, look: [2, 7.5] }],
};
const SPARE = [{ x: -20, z: 2, look: [-20, -2] }, { x: -12, z: 2, look: [-12, -2] }, { x: 12, z: 2, look: [12, -2] }, { x: 24, z: 2, look: [24, -2] }];
const DEPT_WORKSPACE = { Management: "gm-office", Admin: "back-office", Sales: "showroom", Service: "service-desk", Workshop: "workshop", Parts: "parts-counter" };

function assignSlots(people) {
  const free = Object.fromEntries(Object.entries(SLOTS).map(([k, v]) => [k, [...v]]));
  const out = new Map();
  const take = (ws, p) => {
    const list = free[ws]; if (!list || !list.length) return false;
    let i = list.findIndex((s) => s.hint && s.hint.test(p.role || ""));
    if (i < 0) i = list.findIndex((s) => !s.hint);
    if (i < 0) i = 0;
    out.set(p.id, list.splice(i, 1)[0]); return true;
  };
  // managers first so they claim the hinted desk
  const ordered = [...people].sort((a, b) => (/manager/i.test(b.role || "") ? 1 : 0) - (/manager/i.test(a.role || "") ? 1 : 0));
  for (const p of ordered) {
    if (take(p.workspace, p)) continue;
    if (take(DEPT_WORKSPACE[p.department], p)) continue;
    if (SPARE.length) out.set(p.id, SPARE.shift());
  }
  return out;
}

}

function makeTag(p) {

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function placeholderAvatar(p) {
  const col = DEPT_COLORS[p.department] || "#888";
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" fill="#1b2129"/><circle cx="60" cy="48" r="22" fill="${col}" opacity="0.9"/><path d="M18 120c4-28 22-40 42-40s38 12 42 40z" fill="${col}" opacity="0.7"/><text x="60" y="56" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#0e1218">${esc(initials(p.name))}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
function avatarOf(p) { return p.avatar || placeholderAvatar(p); }
function nameOf(id) { const p = STAFF.find((s) => s.id === id); return p ? `${p.name} (${p.role})` : id; }

function miniMarkdown(md) {
  const lines = String(md || "").split(/\r?\n/);
  let html = "", inList = false;
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>").replace(/`(.+?)`/g, "<code>$1</code>");
  for (const raw of lines) {
    const l = raw.trim();
    if (/^[-*]\s+/.test(l)) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${inline(l.replace(/^[-*]\s+/, ""))}</li>`; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    if (!l) continue;
    const hm = l.match(/^(#{1,6})\s+(.*)/);
    if (hm) { if (hm[1].length === 1) continue; html += `<h3>${inline(hm[2])}</h3>`; continue; }
    html += `<p>${inline(l)}</p>`;
  }
  if (inList) html += "</ul>";
  return html;
}

const SKIP_KEYS = new Set(["risk_profile", "gender", "id", "name", "role", "department", "summary", "avatar", "profile_md", "workspace", "reports_to", "email", "scene"]);
function factValue(v) {
  if (Array.isArray(v)) return v.map((x) => (typeof x === "object" ? Object.values(x).join(" · ") : x)).join(", ");
  if (v && typeof v === "object") return Object.entries(v).map(([k, x]) => `${k}: ${Array.isArray(x) ? x.join(", ") : x}`).join("; ");
  return v;
}

function openCard(p) {
  selected = p;
  const col = DEPT_COLORS[p.department] || "#aaa";
  const isCustomer = p.department === "Customer";
  const facts = [];
  if (p.workspace) facts.push(["Works at", p.workspace.replace(/-/g, " ")]);
  if (p.reports_to) facts.push(["Reports to", nameOf(p.reports_to)]);
  if (p.email) facts.push(["Email", p.email]);
  if (p.scene) facts.push(["Scene", p.scene]);
  for (const [k, v] of Object.entries(p)) {
    if (SKIP_KEYS.has(k) || v === null || v === undefined || v === "") continue;
    const val = factValue(v); if (String(val).length > 220) continue;
    facts.push([k.replace(/_/g, " "), val]);
  }
  const reports = STAFF.filter((s) => s.reports_to === p.id);
  if (reports.length) facts.push(["Team", reports.map((r) => r.name).join(", ")]);
  cardBody.innerHTML = `

      <div style="min-width:0">

        <span class="chip" style="background:${col}">${esc(p.department)}</span>
      </div>
    </div>
    ${p.summary ? `<p class="summary">${esc(p.summary)}</p>` : ""}
    <dl class="facts">${facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    ${p.profile_md ? `<div class="profile">${miniMarkdown(p.profile_md)}</div>` : ""}
    <div class="card-actions">
      <button class="primary" id="card-go">Walk to ${esc(isCustomer ? "them" : p.name.split(" ")[0])}</button>
    </div>
    ${isCustomer ? "" : `<div class="agentline">AI agent: agent/${esc(p.id)} · acts as this person in the live simulation</div>`}`;
  document.getElementById("card-go").onclick = () => goTo(p);
  cardEl.classList.add("open");
  cardEl.scrollTop = 0;
  for (const f of figures) f.userData.ring.material.opacity = f.userData.person === p ? 0.95 : 0;
}
function closeCard() { cardEl.classList.remove("open"); selected = null; for (const f of figures) f.userData.ring.material.opacity = 0; }
document.getElementById("card-close").onclick = closeCard;

function goTo(p) {
  const f = figures.find((x) => x.userData.person === p); if (!f) return;
  // stand 2.4 m away, preferring the side the visitor is already on
  const base = Math.atan2(player.x - f.position.x, player.z - f.position.z);
  let spot = null;
  for (let i = 0; i < 24 && !spot; i++) {
    const a = base + (i % 2 ? 1 : -1) * Math.ceil(i / 2) * (Math.PI / 12);
    const tx = f.position.x + Math.sin(a) * 2.4, tz = f.position.z + Math.cos(a) * 2.4;
    if (!blocked(tx, tz) && zoneAt(tx, tz) !== "Outside" && zoneAt(tx, tz).length && !underRaisedCar(tx, tz)) spot = [tx, tz];
  }
  if (spot) { player.x = spot[0]; player.z = spot[1]; if (mode === "bird") setMode("walk"); }
  else teleport(f.position.x, f.position.z - 2.4);
  player.yaw = Math.atan2(player.x - f.position.x, player.z - f.position.z);
  player.pitch = -0.08;
}

const mini = document.getElementById("minimap");

const VIEW = { x1: -34, x2: 34, z1: -40, z2: 22 };  // world window for the minimap

function drawPlan(cv, { labels = false, view = VIEW } = {}) {
  const g = cv.getContext("2d");
  const W = cv.width, Hh = cv.height;
  const sx = W / (view.x2 - view.x1), sz = Hh / (view.z2 - view.z1);
  const s = Math.min(sx, sz);
  const ox = (W - (view.x2 - view.x1) * s) / 2, oz = (Hh - (view.z2 - view.z1) * s) / 2;
  // plan is drawn with the street at the bottom, as seen walking in from the street:
  // screen y grows as world z falls, and world +x is on the visitor's left
  const X = (x) => ox + (view.x2 - x) * s;
  const Y = (z) => oz + (view.z2 - z) * s;
  g.clearRect(0, 0, W, Hh);
  g.fillStyle = "#0f141b"; g.fillRect(0, 0, W, Hh);
  g.fillStyle = "#1a2028"; g.fillRect(X(view.x2), Y(-37), (view.x2 - view.x1) * s, 4 * s); // pavement
  g.fillStyle = "#151a21"; g.fillRect(X(31), Y(-21), 62 * s, -14 * s);
  for (const zn of ZONES) {
    g.fillStyle = zn.color + "26"; g.fillRect(X(zn.x2), Y(zn.z2), (zn.x2 - zn.x1) * s, (zn.z2 - zn.z1) * s);
  }
  g.fillStyle = "#3b8bea33"; g.fillRect(X(8), Y(0), 8 * s, 7 * s);
  // walls from colliders that are long and thin
  g.fillStyle = "#c9d2dd";
  for (const c of colliders) {
    const w = c.maxX - c.minX, d = c.maxZ - c.minZ;
    if ((w <= 0.25 && d > 0.8) || (d <= 0.25 && w > 0.8)) g.fillRect(X(c.maxX), Y(c.maxZ), Math.max(1.5, w * s), Math.max(1.5, d * s));
  }
  // furniture & cars
  g.fillStyle = "#56616e";
  for (const c of colliders) {
    const w = c.maxX - c.minX, d = c.maxZ - c.minZ;
    if (w > 0.25 && d > 0.25 && w * d < 40) g.fillRect(X(c.maxX), Y(c.maxZ), w * s, d * s);
  }
  // people
  for (const f of figures) {
    const p = f.userData.person;
    g.fillStyle = DEPT_COLORS[p.department] || "#fff";
    g.beginPath(); g.arc(X(f.position.x), Y(f.position.z), Math.max(2.5, 0.42 * s), 0, Math.PI * 2); g.fill();
    if (labels && p.department !== "Customer") {
      g.fillStyle = "#e8edf3"; g.font = `600 ${Math.round(0.9 * s)}px 'Barlow Condensed', sans-serif`; g.textAlign = "left";
      g.fillText(p.name, X(f.position.x) + 0.7 * s, Y(f.position.z) - 0.4 * s);
    }
  }
  if (labels) {
    g.textAlign = "center"; g.fillStyle = "#93a1b3"; g.font = `600 ${Math.round(1.1 * s)}px 'Barlow Condensed', sans-serif`;
    for (const zn of ZONES) if (zn.name !== "Corridor") g.fillText(zn.name.toUpperCase(), X((zn.x1 + zn.x2) / 2), Y(zn.z1) - 0.8 * s);
    g.fillText("CUSTOMER LOUNGE", X(-25), Y(-7.6));
    g.fillText("SALES MGR", X(4), Y(-6.4));
    g.fillText("FORECOURT · CUSTOMER PARKING", X(0), Y(-24));
    g.fillText("MAIN ENTRANCE ▲", X(-10), Y(-21.6));
    g.fillText("SERVICE ENTRANCE ▲", X(12), Y(-21.6));
    g.fillText("VEHICLE DOOR ▶", X(27), Y(11.5));
    // scale bar
    g.strokeStyle = "#93a1b3"; g.lineWidth = 2; g.beginPath(); g.moveTo(X(32), Y(-38.5)); g.lineTo(X(22), Y(-38.5)); g.stroke();
    g.textAlign = "left"; g.fillText("10 m", X(32), Y(-37.6));
  }
  // player
  if (mode === "walk") {
    const px = X(player.x), py = Y(player.z);
    const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw);
    const ang = Math.atan2(-fz, -fx);
    g.fillStyle = "rgba(255,255,255,0.14)";
    g.beginPath(); g.moveTo(px, py); g.arc(px, py, 7 * s, ang - 0.6, ang + 0.6); g.closePath(); g.fill();
    g.fillStyle = "#ffffff"; g.beginPath(); g.arc(px, py, Math.max(3.5, 0.55 * s), 0, Math.PI * 2); g.fill();
  }
  return { X, Y, s, ox, oz, view };
}
function planClick(cv, e, view) {
  const r = cv.getBoundingClientRect();
  const W = cv.width, Hh = cv.height;
  const s = Math.min(W / (view.x2 - view.x1), Hh / (view.z2 - view.z1));
  const ox = (W - (view.x2 - view.x1) * s) / 2, oz = (Hh - (view.z2 - view.z1) * s) / 2;
  const cx = (e.clientX - r.left) * (W / r.width), cy = (e.clientY - r.top) * (Hh / r.height);
  return { x: view.x2 - (cx - ox) / s, z: view.z2 - (cy - oz) / s };
}
mini.addEventListener("click", (e) => { const p = planClick(mini, e, VIEW); teleport(p.x, p.z); });
const PLAN_VIEW = { x1: -33, x2: 33, z1: -40, z2: 22 };
planCanvas.addEventListener("click", (e) => { const p = planClick(planCanvas, e, PLAN_VIEW); teleport(p.x, p.z); showPlan(false); });
function showPlan(on) { planEl.hidden = !on; if (on) drawPlan(planCanvas, { labels: true, view: PLAN_VIEW }); }
function togglePlan() { showPlan(planEl.hidden); }
document.getElementById("btn-plan").onclick = togglePlan;
document.getElementById("plan-close").onclick = () => showPlan(false);
document.getElementById("legend").innerHTML = Object.entries(DEPT_COLORS).map(([d, c]) => `<span><i style="background:${c}"></i>${d}</span>`).join("") + `<span>Click anywhere on the plan to walk there.</span>`;

/* ------------------------------------------------------------------ modes & dock */

const birdBtn = document.getElementById("btn-bird");
function setMode(m) {
  mode = m;
  ceil.visible = m === "walk";
  birdBtn.classList.toggle("on", m === "bird");
  birdBtn.textContent = m === "bird" ? "Walk" : "Bird's-eye";
}
birdBtn.onclick = () => setMode(mode === "walk" ? "bird" : "walk");
document.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => { const j = JUMPS[b.dataset.go]; teleport(j.x, j.z, j.yaw); player.pitch = -0.05; });

/* ------------------------------------------------------------------ loop */

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

const zoneEl = document.getElementById("zone"), coordsEl = document.getElementById("coords");
let last = performance.now(), lastZone = "", mapTick = 0;
const fwdV = new THREE.Vector3();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; const t = now / 1000;
  const k = (n) => keys.has(n) || pad.has(n);
  if (mode === "walk") {
    if (k("turnL")) player.yaw += 1.9 * dt;
    if (k("turnR")) player.yaw -= 1.9 * dt;
    const speed = (keys.has("run") ? 8 : 4.2) * dt;
    const f = (k("fwd") ? 1 : 0) - (k("back") ? 1 : 0);
    const s = (k("right") ? 1 : 0) - (k("left") ? 1 : 0);
    if (f || s) {
      const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw);
      const rx = Math.cos(player.yaw), rz = -Math.sin(player.yaw);
      const len = Math.hypot(f, s);
      tryMove((fx * f + rx * s) / len * speed, (fz * f + rz * s) / len * speed);
    }
    const bob = (f || s) ? Math.sin(t * 9) * 0.025 : 0;
    camera.position.set(player.x, player.eye + bob, player.z);
    camera.rotation.set(player.pitch, player.yaw, 0);
  } else {
    const cx = 0, cz = -2;
    camera.position.set(cx + Math.sin(bird.az) * Math.cos(bird.el) * bird.dist, Math.sin(bird.el) * bird.dist, cz - Math.cos(bird.az) * Math.cos(bird.el) * bird.dist);
    camera.lookAt(cx, 0, cz);
  }
  for (const fn of animated) fn(t, dt);
  // name tags: fade with distance so the room stays readable
  for (const f of figures) {
    const d = Math.hypot(f.position.x - camera.position.x, f.position.z - camera.position.z);
    const tag = f.userData.tag; const op = mode === "bird" ? 0.95 : Math.max(0, Math.min(1, (16 - d) / 6));
    tag.material.opacity = op; tag.visible = op > 0.02;
    if (mode === "bird") tag.scale.set(3, 0.75, 1); else tag.scale.set(1.25, 0.31, 1);
  }
  renderer.render(scene, camera);

  if (++mapTick % 3 === 0) {
    drawPlan(mini);
    const z = mode === "walk" ? zoneAt(player.x, player.z) : "Bird's-eye view";
    if (z !== lastZone) { zoneEl.textContent = z; lastZone = z; }
    coordsEl.textContent = `x ${player.x.toFixed(0)} · z ${player.z.toFixed(0)}`;
  }
  requestAnimationFrame(frame);
}
document.getElementById("loading").remove();
requestAnimationFrame(frame);

// expose a tiny API for docs/tests
window.vxc = { STAFF, figures, teleport, openCard, setMode, player };
</script>
