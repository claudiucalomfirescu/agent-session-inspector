prax: "0.1"
name: vxc-motors-sim
kind: system
one_liner: "A simulated BMW dealership whose 12 employees are LLM agents and whose enterprise apps are tools backed by small real local services."
status: draft
level_target: silver
components:
  - {id: C-01, name: agents (employees), path: agents/}
  - {id: C-02, name: tool services (CRM, DMS, workshop, parts, finance, mail, chat), path: services/}
  - {id: C-03, name: BMW portal (judgment agent), path: services/bmw_portal/}
  - {id: C-04, name: workday runner, path: runner/}
contracts:
  provides: ["K-vxc-tools@1"]
  depends_on: ["K-openai-chat@1", "K-agent-headers@1"]
run:
  install: "pip install -r requirements.txt"
  demo: ""      # offline, from demo/data, no key
  live: ""
  tests: "python3 -m unittest discover -s tests"
docs:
  goal: GOAL.md
  spec: SPEC.md
  architecture: ARCHITECTURE.md
  prompts: PROMPTS.md
  roadmap: ROADMAP.md
  decisions: DECISIONS.md
  demo: demo/DEMO.md
explainer:
  file: explainers/index.html
  published: ""
built_with:
  model: ""
  date: ""
  language: python
