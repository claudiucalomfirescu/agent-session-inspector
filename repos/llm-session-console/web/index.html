<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Console</title>
<link rel="stylesheet" href="app.css">
<script type="importmap">{"imports": {"three": "./vendor/three.module.min.js"}}</script>
</head>
<body>
<header class="top">
  <a class="brand" href="#/" title="All traffic">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3 2.4"/><circle cx="19.5" cy="8" r="1.6" fill="currentColor"/></svg>
    <span>Session Console</span>
  </a>
  <nav class="tabs" aria-label="Views">
    <a href="#/" data-tab="drill">Drill-down</a>
    <a href="#/fw" data-tab="fw">Firewall</a>
    <a href="#/galaxy" data-tab="galaxy">Galaxy 3D</a>
  </nav>
  <div class="controls">
    <label class="ctl" title="Which proxy log to read">Log <select id="db"></select></label>
    <label class="ctl">Range
      <select id="range">
        <option value="all">All time</option><option value="7">Last 7 days</option>
        <option value="14">Last 14 days</option><option value="30">Last 30 days</option><option value="custom">Custom…</option>
      </select>
    </label>
    <span id="custom" class="ctl" hidden><input type="date" id="from"> – <input type="date" id="to"></span>
    <div class="seg" role="group" aria-label="Chart bucket">
      <button data-bucket="day" class="on">Day</button><button data-bucket="week">Week</button>
    </div>
    <label class="ctl chk" title="Calls made by the firewall's own classifier and other console/system agents"><input type="checkbox" id="system"> system traffic</label>
    <form id="searchform" class="search" role="search"><input id="q" type="search" placeholder="Search messages…" aria-label="Search messages"></form>
    <button id="theme" class="icon" title="Toggle light/dark" aria-label="Toggle theme">◐</button>
  </div>
</header>
<div class="crumbs" id="crumbs" aria-label="Breadcrumb"></div>
<main id="view" tabindex="-1"></main>
<div id="tip" class="tip" hidden></div>
<dialog id="modal"><div class="modal-head"><b id="modal-title"></b><button class="icon" id="modal-close" aria-label="Close">✕</button></div><div id="modal-body"></div></dialog>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
