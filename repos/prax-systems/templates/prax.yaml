# Prax Systems manifest. Keep it short; the docs hold the detail.
prax: "0.1"
name: my-system
kind: system
one_liner: "One sentence a stranger understands."
status: draft            # draft | alpha | beta | stable
level_target: silver     # bronze | silver | gold
components:
  - id: C-01
    name: proxy
    path: src/proxy
contracts:
  provides: []           # e.g. ["K-log-schema@1"]
  depends_on: []         # e.g. ["K-openai-chat@1"]
run:
  install: "pip install -r requirements.txt"
  demo: "python3 demo/run_demo.py"        # works offline from recorded data, no key
  live: "python3 demo/generate.py"        # optional, needs a key
  tests: "python3 -m unittest discover -s tests"
docs:
  goal: GOAL.md
  spec: SPEC.md
  architecture: ARCHITECTURE.md
  prompts: PROMPTS.md
  roadmap: ROADMAP.md
  decisions: DECISIONS.md
  demo: demo/DEMO.md
explainer:
  file: explainers/index.html
  published: ""          # claude.ai artifact link
built_with:
  model: ""              # model family that wrote this rendering
  date: ""
  language: python
