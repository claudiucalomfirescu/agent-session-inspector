prax: "0.1"
name: llm-proxy-log
kind: system
one_liner: "An OpenAI-compatible LLM proxy that logs every exchange to SQLite, with a small dashboard and a recorded demo team."
status: beta
level_target: silver
components:
  - {id: C-01, name: proxy, path: proxy/proxy.py}
  - {id: C-02, name: logstore, path: proxy/logstore.py}
  - {id: C-03, name: gateway, path: proxy/gateway.py}
  - {id: C-04, name: dashboard, path: dashboard/}
  - {id: C-05, name: client helper, path: client/}
  - {id: C-06, name: demo team, path: demo/}
contracts:
  provides: ["K-log-schema@1", "K-agent-headers@1"]
  depends_on: ["K-openai-chat@1"]
run:
  install: "pip install -r requirements.txt   # only the demo agents need it"
  demo: "python3 dashboard/server.py --demo"
  offline: "python3 demo/run.py --offline && python3 dashboard/server.py"
  live: "OPENROUTER_API_KEY=... python3 demo/run.py --live"
  tests: "python3 -m unittest discover -s tests"
docs:
  goal: GOAL.md
  spec: SPEC.md
  architecture: ARCHITECTURE.md
  prompts: PROMPTS.md
  roadmap: ROADMAP.md
  decisions: DECISIONS.md
  demo: demo/DEMO.md
explainer:
  file: explainers/index.html
  published: "https://claude.ai/artifact/B6okrEHnusms6PxDMCbbGY"
built_with:
  model: "Claude (Anthropic), Claude Code cloud session"
  date: "2026-10-30"
  language: python
  demo_data_model: "z-ai/glm-5.3-flash via OpenRouter"
