<style>
/* Layout: same visual system as viz/sequence.html. Session chips, then the inspection pipeline for the
   selected turn, then the turn list on the left and the turn inspector on the right; stacks on phones. */
:root {
  --bg: #FFFFFF; --panel: #F7F8FA; --fg: #15171C; --muted: #5B6270; --line: #E3E5EA; --rail: #D5D9E0;
  --sel: #EEF3FF; --agent: #2457D6; --proxy: #6B3FB5; --llm: #0F6B4F;
  --info: #2B6CB0; --info-bg: #E8F1FB; --warn: #8A5A00; --warn-bg: #FFF2D6; --block: #B42318; --block-bg: #FDE8E6;
  --code-bg: #F1F3F6;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121419; --panel: #1A1D24; --fg: #E8EAEF; --muted: #9AA1AE; --line: #2A2E37; --rail: #343944;
  --sel: #1C2740; --agent: #7FA2FF; --proxy: #B89AF0; --llm: #4FC79F;
  --info: #8CC0F5; --info-bg: #16263A; --warn: #F2C063; --warn-bg: #352812; --block: #FF8A7E; --block-bg: #3A1714;
  --code-bg: #0E1015; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121419; --panel: #1A1D24; --fg: #E8EAEF; --muted: #9AA1AE; --line: #2A2E37; --rail: #343944;
  --sel: #1C2740; --agent: #7FA2FF; --proxy: #B89AF0; --llm: #4FC79F;
  --info: #8CC0F5; --info-bg: #16263A; --warn: #F2C063; --warn-bg: #352812; --block: #FF8A7E; --block-bg: #3A1714;
  --code-bg: #0E1015; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); margin: 0; line-height: 1.45 }
button { font: inherit; cursor: pointer; color: inherit }
button:focus-visible { outline: 2px solid var(--agent); outline-offset: 2px }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 14px; border-bottom: 1px solid var(--line) }
header h1 { margin: 0; font-size: 17px; font-weight: 700 }
header .sub { font-size: 13px; color: var(--muted) }
.sessions { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto }
.chip { border: 1px solid var(--rail); background: var(--bg); border-radius: 999px; padding: 6px 12px; min-height: 36px; font-size: 13px; display: inline-flex; gap: 8px; align-items: center }
.chip[aria-selected="true"] { border-color: var(--agent); background: var(--sel) }
.chip code { font-family: var(--mono); font-size: 12px; color: var(--muted) }
.summary { display: flex; flex-wrap: wrap; gap: 8px 24px; padding-block: 14px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line) }
.summary b { color: var(--fg); font-weight: 600 }
.summary code { font-family: var(--mono); font-size: 12px }

/* inspection pipeline */
.pipe-wrap { overflow-x: auto; border-bottom: 1px solid var(--line) }
.pipe { display: grid; grid-template-columns: repeat(6, minmax(110px, 1fr)); gap: 0; min-width: 720px; padding-block: 16px }
.stage { position: relative; padding: 10px 12px; border: 1px solid var(--rail); border-right: none; background: var(--bg); font-size: 12px; min-height: 86px; display: flex; flex-direction: column; gap: 4px }
.stage:last-child { border-right: 1px solid var(--rail) }
.stage:first-child { border-radius: 10px 0 0 10px } .stage:last-child { border-radius: 0 10px 10px 0 }
.stage .k { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.stage .v { font-weight: 600; font-size: 13px }
.stage .d { color: var(--muted); font-family: var(--mono); font-size: 11px; overflow-wrap: anywhere }
.stage.off { opacity: .45 }
.stage.hit-info { background: var(--info-bg) } .stage.hit-warning { background: var(--warn-bg) } .stage.hit-block { background: var(--block-bg) }

.layout { display: flex; flex-wrap: wrap; align-items: stretch }
main { flex: 999 1 560px; min-width: 0; padding-block: 12px 24px; display: flex; flex-direction: column; gap: 8px }
.turn { text-align: left; width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 6px 12px; align-items: start }
.turn[aria-pressed="true"] { border-color: var(--agent); background: var(--sel) }
.turn .n { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 2px }
.turn .said { font-size: 14px; font-weight: 500 }
.turn .got { grid-column: 2 / 4; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; min-width: 0 }
.turn .got span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }
.who { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap }
.who.llm { color: var(--llm) } .who.proxy { color: var(--proxy) }
.pill { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; border-radius: 999px; padding: 3px 9px; white-space: nowrap }
.pill.none { color: var(--muted); border: 1px solid var(--rail) }
.pill.info { color: var(--info); background: var(--info-bg) }
.pill.warning { color: var(--warn); background: var(--warn-bg) }
.pill.block { color: var(--block); background: var(--block-bg) }

aside { flex: 1 1 380px; min-width: 0; border-left: 1px solid var(--line); background: var(--panel); padding: 18px; display: flex; flex-direction: column; gap: 14px }
aside h2 { margin: 0; font-size: 15px; text-wrap: balance }
aside h3 { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.sig { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; font-size: 13px; padding-block: 8px; border-top: 1px solid var(--line) }
.sig:first-of-type { border-top: none }
.sig > .pill { align-self: start; text-align: center }
.sig .meta { font-family: var(--mono); font-size: 11px; color: var(--muted) }
.views { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px }
.view { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 13px; display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.view pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--mono); font-size: 11.5px; background: var(--code-bg); border-radius: 6px; padding: 8px }
.note { font-size: 12px; color: var(--muted) }
@media (max-width: 720px) { aside { border-left: none; border-top: 1px solid var(--line) } }
</style>

<script>
const DATA = JSON.parse(document.getElementById("fw-data").textContent || "{}");
const RANK = { info: 1, warning: 2, block: 3 };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const pill = (lv) => `<span class="pill ${lv || "none"}">${lv || "clean"}</span>`;
const topLevel = (sigs) => sigs.reduce((a, s) => (RANK[s.level] > (RANK[a] || 0) ? s.level : a), null);
const byProxy = (t) => (t.route || "").startsWith("firewall");
const DETECTOR = { keyword: "Keyword", intent_heuristic: "Co-occurrence", intent_llm: "LLM intent", escalation: "Escalation", session: "Session already blocked" };
let cur = { s: 0, t: 0 };

function sessionName(s) { return (s.labels.person || s.agent).replace(/-/g, " ").replace(/\b\w/g, (c) => c.toUpperCase()); }

function renderSessions() {
  $("sessions").innerHTML = DATA.sessions.map((s, i) =>
    `<button class="chip" role="tab" aria-selected="${i === cur.s}" data-i="${i}"><b>${esc(sessionName(s))}</b><code>${esc(s.session)}</code></button>`).join("");
  $("sessions").querySelectorAll("button").forEach((b) => b.onclick = () => { cur = { s: +b.dataset.i, t: firstBlock(+b.dataset.i) }; render(); });
}

function firstBlock(si) {
  const i = DATA.sessions[si].turns.findIndex((t) => t.level === "block");
  return i < 0 ? 0 : i;
}

function renderSummary(s) {
  const blocked = s.turns.filter(byProxy);
  const act = DATA.actions.find((a) => a.session === s.session && a.action === "block_session");
  const llmTokens = s.turns.filter((t) => !byProxy(t)).reduce((a, t) => a + (t.tokens || 0), 0);
  $("summary").innerHTML = [
    `Agent <b>${esc(s.agent)}</b> · ${esc(s.labels.role || "")}`,
    `<b>${s.turns.length}</b> turns, <b>${s.turns.length - blocked.length}</b> answered by the LLM, <b>${blocked.length}</b> by the proxy`,
    act ? `Blocked at turn <b>${s.turns.findIndex((t) => t.level === "block") + 1}</b> for <b>${esc(DATA.topics[act.topic]?.title || act.topic)}</b>, ref <code>${esc(act.ref)}</code>` : "Not blocked",
    `LLM tokens: <b>${llmTokens.toLocaleString()}</b>; blocked turns cost <b>0</b>`,
  ].map((x) => `<span>${x}</span>`).join("");
}

function renderPipe(t) {
  const req = t.signals.filter((x) => x.direction === "request");
  const res = t.signals.filter((x) => x.direction === "response");
  const pick = (det) => req.filter((x) => x.detector === det);
  const stage = (k, sigs, idle, extra = "") => {
    const lv = topLevel(sigs);
    const d = sigs.map((x) => x.matched || x.rationale || x.rule).join(" · ");
    return `<div class="stage ${lv ? "hit-" + lv : ""} ${extra}"><span class="k">${k}</span><span class="v">${lv ? pill(lv) : esc(idle)}</span><span class="d">${esc(d).slice(0, 140)}</span></div>`;
  };
  const sess = pick("session");
  const kw = pick("keyword"), co = pick("intent_heuristic"), llm = pick("intent_llm").concat(pick("escalation"));
  const verdict = topLevel(req);
  const stopped = sess.length > 0;
  $("pipe").innerHTML = [
    `<div class="stage"><span class="k">Agent sends</span><span class="v" style="color:var(--agent)">turn ${t.turn}</span><span class="d">${esc(t.sent).slice(0, 110)}</span></div>`,
    stopped ? stage("Session state", sess, "") : stage("1 · Keyword", kw, "no match"),
    stopped ? `<div class="stage off"><span class="k">2 · Co-occurrence</span><span class="v">skipped</span></div>` : stage("2 · Co-occurrence", co, "no match"),
    stopped ? `<div class="stage off"><span class="k">3 · LLM intent</span><span class="v">skipped</span></div>` : stage("3 · LLM intent", llm, (kw.length || co.length) ? "not needed" : "not asked"),
    `<div class="stage ${verdict ? "hit-" + verdict : ""}"><span class="k">Verdict</span><span class="v">${pill(verdict)}</span><span class="d">${verdict === "block" ? "not forwarded" : "forwarded to OpenRouter"}</span></div>`,
    byProxy(t)
      ? `<div class="stage hit-block"><span class="k">Reply from</span><span class="v" style="color:var(--proxy)">Proxy (as the LLM)</span><span class="d">${t.route === "firewall-response" ? "LLM answer withheld" : "0 tokens, no upstream call"}</span></div>`
      : stage("Reply from", res, "LLM · " + (t.model || ""), ""),
  ].join("");
}

function renderTurns(s) {
  $("turns").innerHTML = s.turns.map((t, i) => {
    const lv = topLevel(t.signals);
    return `<button class="turn" aria-pressed="${i === cur.t}" data-i="${i}">
      <span class="n">T${t.turn}</span><span class="said">${esc(t.sent)}</span>${pill(lv)}
      <span class="got"><span class="who ${byProxy(t) ? "proxy" : "llm"}">${byProxy(t) ? "proxy" : "llm"}</span><span>${esc(t.answer)}</span></span></button>`;
  }).join("");
  $("turns").querySelectorAll("button").forEach((b) => b.onclick = () => { cur.t = +b.dataset.i; render(); });
}

function renderDetail(s, t) {
  const fw = t.agent_view?.firewall;
  const sigs = t.signals.map((x) => `<div class="sig">${pill(x.level)}<div><b>${esc(DETECTOR[x.detector] || x.detector)}</b> · ${esc(DATA.topics[x.topic]?.title || x.topic)} <span class="meta">${esc(x.direction)} · ${esc(x.rule)}${x.confidence != null ? " · conf " + x.confidence : ""}</span><div>${esc(x.matched ? "matched: " + x.matched : x.rationale || "")}</div>${x.ref ? `<div class="meta">${esc(x.ref)}</div>` : ""}</div></div>`).join("")
    || `<div class="note">No rule fired. The request went straight through.</div>`;
  const acts = DATA.actions.filter((a) => a.session === s.session && t.signals.some((x) => x.ref && x.ref === a.ref) && t.signals.some((x) => x.detector !== "session"));
  $("detail").innerHTML = `
    <h2>Turn ${t.turn}: ${byProxy(t) ? "the proxy answered" : "the LLM answered"}</h2>
    <div class="note">${esc(t.ts)} · ${t.duration_ms.toLocaleString()} ms · route <code>${esc(t.route)}</code></div>
    <h3>Signals recorded</h3><div>${sigs}</div>
    ${acts.length ? `<h3>Admin actions</h3>${acts.map((a) => `<div class="note"><b>${esc(a.actor)}</b> · ${esc(a.action)} · ${esc(a.reason)} · ${esc(a.ref)}</div>`).join("")}` : ""}
    <h3>Two views of the same answer</h3>
    <div class="views">
      <div class="view"><b style="color:var(--agent)">Agent's own log</b><span class="note">logs/agents/${esc(s.agent)}.jsonl</span><pre>${esc(t.agent_view?.content || "")}</pre>
        <span class="note">${fw ? `Header X-Firewall: ${esc(fw.level)}${fw.ref ? " · " + esc(fw.ref) : ""}. The text alone looks like an ordinary model answer.` : "No firewall header."}</span></div>
      <div class="view"><b style="color:var(--proxy)">Proxy log</b><span class="note">calls · signals · admin_actions</span><pre>route=${esc(t.route)}
firewall_level=${esc(t.level || "null")}
model=${esc(t.model)}
tokens=${t.tokens}</pre>
        <span class="note">${byProxy(t) ? "The proxy knows why: topic, detector and reference are in its tables." : "Forwarded upstream; the answer is the model's."}</span></div>
    </div>`;
}

function render() {
  const s = DATA.sessions[cur.s];
  if (!s) { $("summary").textContent = "No snapshot embedded. Run viz/embed_firewall.py."; return; }
  const t = s.turns[cur.t];
  renderSessions(); renderSummary(s); renderPipe(t); renderTurns(s); renderDetail(s, t);
}
cur.t = DATA.sessions ? firstBlock(0) : 0;
render();
</script>
