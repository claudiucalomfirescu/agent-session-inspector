<title>LLM Proxy Topology</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: step tabs + play controls on top; the chain of boxes (agent → proxy → provider, log below) left; entity config/code right. */
:root {
  --bg: #F7F6F2; --card: #FFFFFF; --fg: #15171C; --muted: #4A4F5A; --line: #E2DFD6; --seg: #E9E7E0; --seg2: #F1EFE9;
  --idle: #C9C5BA; --idle-fg: #6B6F78; --hot: #D97706; --hot-bg: #FFF7E0; --hot-ring: #F5D58A; --cap: #FFF2CC;
  --ink: #15171C; --ink-fg: #FFFFFF; --code-bg: #15171C; --code-fg: #E6E8EC; --code-n: #7D8594; --add: #16352A; --add-fg: #7FE0B8;
  --agent: #2457D6; --proxy: #6B3FB5; --llm: #0F6B4F; --db: #8A4B00;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131417; --card: #1B1D22; --fg: #E8E9EC; --muted: #A3A8B3; --line: #2C2F36; --seg: #24272D; --seg2: #24272D;
  --idle: #454952; --idle-fg: #9298A3; --hot: #F59E0B; --hot-bg: #33270F; --hot-ring: #7A5A16; --cap: #33290F;
  --ink: #E8E9EC; --ink-fg: #131417; --code-bg: #0B0C0F; --code-fg: #DDE1E8; --code-n: #6B7280; --add: #12301F; --add-fg: #7FE0B8;
  --agent: #7FA2FF; --proxy: #B89AF0; --llm: #4FC79F; --db: #E3A15A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #131417; --card: #1B1D22; --fg: #E8E9EC; --muted: #A3A8B3; --line: #2C2F36; --seg: #24272D; --seg2: #24272D;
  --idle: #454952; --idle-fg: #9298A3; --hot: #F59E0B; --hot-bg: #33270F; --hot-ring: #7A5A16; --cap: #33290F;
  --ink: #E8E9EC; --ink-fg: #131417; --code-bg: #0B0C0F; --code-fg: #DDE1E8; --code-n: #6B7280; --add: #12301F; --add-fg: #7FE0B8;
  --agent: #7FA2FF; --proxy: #B89AF0; --llm: #4FC79F; --db: #E3A15A; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); margin: 0 }
button { font: inherit; cursor: pointer; color: inherit }
button:focus-visible { outline: 2px solid var(--agent); outline-offset: 2px }
.page { padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px }
h1 { margin: 0; font-size: 20px }
.seg { display: flex; flex-wrap: wrap; gap: 4px; background: var(--seg); border-radius: 10px; padding: 4px }
.seg button { border: none; border-radius: 8px; padding: 8px 14px; min-height: 40px; font-size: 14px; font-weight: 600; background: transparent }
.seg button[aria-selected="true"] { background: var(--card) }
.ctl { margin-left: auto; display: flex; gap: 6px }
.ctl .sq { border: 1px solid var(--line); background: var(--card); border-radius: 8px; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center }
.ctl .play { border: none; background: var(--ink); color: var(--ink-fg); border-radius: 8px; padding: 0 16px; height: 44px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px }
.goal { margin: 0; font-size: 14px; color: var(--muted); max-width: 80ch }
.cols { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start }
.diagram { flex: 999 1 640px; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 20px }
.caption { display: flex; align-items: center; gap: 12px; border-radius: 10px; padding: 10px 14px; min-height: 44px; background: var(--seg2) }
.caption.on { background: var(--cap) }
.caption code { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--ink-fg); background: var(--ink); border-radius: 6px; padding: 3px 8px; white-space: nowrap }
.caption span { font-size: 14px }
.chain { display: flex; align-items: stretch; overflow-x: auto; padding-bottom: 4px }
.node { flex: 1 0 170px; text-align: left; border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px }
.node.active { background: var(--hot-bg); box-shadow: 0 0 0 4px var(--hot-ring) }
.node .t { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px }
.node .t i { width: 10px; height: 10px; border-radius: 5px }
.node .w { font-family: var(--mono); font-size: 12px; color: var(--muted) }
.node .f { font-size: 13px; line-height: 1.4 }
.link { flex: 1 0 140px; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 0 6px }
.link code { font-family: var(--mono); font-size: 11px; text-align: center; color: var(--idle-fg) }
.link code.on { color: var(--fg) }
.bar { position: relative; height: 3px; border-radius: 2px; background: var(--idle) }
.bar.on { background: var(--hot) }
.bar::after { content: ""; position: absolute; top: -5px; width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent }
.bar.r::after { right: -2px; border-left: 9px solid var(--idle) } .bar.r.on::after { border-left-color: var(--hot) }
.bar.l { margin-top: 8px } .bar.l::after { left: -2px; border-right: 9px solid var(--idle) } .bar.l.on::after { border-right-color: var(--hot) }
.dbwrap { display: flex; flex-direction: column; align-items: center; gap: 6px }
.dbwrap .stem { width: 3px; height: 34px; background: var(--idle) } .dbwrap .stem.on { background: var(--hot) }
.dbwrap > code { font-family: var(--mono); font-size: 11px; color: var(--muted) }
.dbwrap .node { flex: none; min-width: min(260px, 100%) }
.side { flex: 1 1 400px; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px }
.side .k { font-size: 12px; font-weight: 700; letter-spacing: .06em }
.side h2 { margin: 0; font-size: 20px }
.side p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.5 }
.side .seg { background: var(--seg2); border-radius: 8px } .side .seg button { flex: 1; min-height: 36px; font-size: 13px; border-radius: 6px }
.cfg { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px }
.cfg b { font-family: var(--mono); font-size: 13px }
.cfg code { font-family: var(--mono); font-size: 12px; color: var(--agent); word-break: break-all }
.cfg span { font-size: 12px; color: var(--muted) }
.file { font-family: var(--mono); font-size: 12px; color: var(--muted) }
.code { background: var(--code-bg); border-radius: 8px; padding: 10px 0; overflow: auto; max-height: 470px }
.ln { display: flex; font-family: var(--mono); font-size: 12px; line-height: 1.6; width: max-content; min-width: 100% }
.ln.add { background: var(--add) }
.ln span:nth-child(1) { flex: 0 0 34px; text-align: right; padding-right: 10px; color: var(--code-n) }
.ln span:nth-child(2) { flex: 0 0 14px; color: var(--add-fg) }
.ln span:nth-child(3) { white-space: pre; color: var(--code-fg); padding-right: 12px }
.hint { font-size: 12px; color: var(--muted) }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<div class="page">
  <header>
    <h1>LLM proxy · architecture</h1>
    <div class="seg" role="tablist" aria-label="Build step" id="steps"></div>
    <div class="ctl">
      <button type="button" class="sq" id="prev" aria-label="Previous hop"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
      <button type="button" class="play" id="play"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg><span id="playLabel">Play turn</span></button>
      <button type="button" class="sq" id="next" aria-label="Next hop"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
    </div>
  </header>
  <p class="goal" id="goal"></p>
  <div class="cols">
    <section class="diagram" aria-label="Diagram">
      <div class="caption" id="caption"><code id="counter"></code><span id="captionText"></span></div>
      <div class="chain" id="chain"></div>
      <div class="dbwrap" id="db"></div>
    </section>
    <aside class="side" aria-label="Entity detail" id="side"></aside>
  </div>
</div>

<script>
(function () {
  const SPEED = 1200;
  const state = { step: 3, hop: -1, ent: 'agent', tab: 'cfg' };
  let timer = null;
  const el = (tag, attrs, kids) => {
    const n = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (k === 'style') n.style.cssText = v; else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
    });
    (kids || []).forEach(c => c && n.appendChild(c));
    return n;
  };
  const STEPS = [
    { id: 1, label: 'Step 1 · Direct', goal: 'Prove the agent works on its own: agent → OpenRouter, real key in the agent.' },
    { id: 2, label: 'Step 2 · Pass-through', goal: 'Put the proxy in the path without changing what the agent experiences. Only the base URL and a dummy key change.' },
    { id: 3, label: 'Step 3 · Logging', goal: 'The proxy records every exchange so a whole conversation can be read back, turn by turn.' }
  ];

  function hops(step) {
    if (step === 1) return [
      { link: 0, dir: 'req', actor: 'agent', text: 'Agent POSTs the conversation to OpenRouter with the real key (Bearer sk-or-…).' },
      { link: 0, dir: 'resp', actor: 'llm', text: 'OpenRouter answers: finish_reason=tool_calls, get_order(A-1001).' },
      { actor: 'agent', text: 'Agent runs get_order locally, appends the tool result and loops.' }
    ];
    const h = [
      { link: 0, dir: 'req', actor: 'agent', text: 'Agent POSTs to 127.0.0.1:8080/v1 with Bearer dummy and X-Agent-Id / X-Session-Id.' },
      { link: 1, dir: 'req', actor: 'proxy', text: 'Proxy drops the dummy key and X-* headers, adds the real key, forwards the body unchanged.' },
      { link: 1, dir: 'resp', actor: 'llm', text: 'OpenRouter answers the proxy (or returns an error status and body).' }
    ];
    if (step === 3) h.push({ db: true, actor: 'db', text: 'Proxy writes one row to logs/proxy.db: timing, ids, full request and response, secrets redacted.' });
    h.push({ link: 0, dir: 'resp', actor: 'proxy', text: 'Proxy returns status, headers and body to the agent exactly as received.' });
    h.push({ actor: 'agent', text: 'Agent runs the tool locally, appends the result and loops. The proxy never sees this step.' });
    return h;
  }

  const code = (src, added) => src.split('\n').map((t, i) => ({ n: i + 1, t, add: added.indexOf(i + 1) >= 0 }));

  function entities(step) {
    const agentCode = step === 1
? `client = OpenAI(base_url=BASE_URL, api_key=API_KEY)
messages = [{"role": "system", "content": SYSTEM_PROMPT},
            {"role": "user", "content": GOAL}]

for turn in range(1, MAX_TURNS + 1):
    resp = client.chat.completions.create(
        model=MODEL, messages=messages, tools=TOOL_SPECS,
        extra_body={"reasoning": {"enabled": True}})
    msg = resp.choices[0].message
    messages.append(msg.model_dump(exclude_none=True))
    if not msg.tool_calls:
        print(f"final answer: {msg.content}")
        return 0
    for call in msg.tool_calls:
        args = json.loads(call.function.arguments or "{}")
        result = TOOLS[call.function.name](**args)
        messages.append({"role": "tool",
                         "tool_call_id": call.id, "content": result})`
: `session_id = uuid.uuid4().hex[:12]
client = OpenAI(base_url=BASE_URL, api_key=API_KEY, default_headers={
    "X-Agent-Id": os.environ.get("AGENT_ID", "agent-1"),
    "X-Session-Id": session_id})
messages = [{"role": "system", "content": SYSTEM_PROMPT},
            {"role": "user", "content": GOAL}]

for turn in range(1, MAX_TURNS + 1):
    resp = client.chat.completions.create(
        model=MODEL, messages=messages, tools=TOOL_SPECS,
        extra_body={"reasoning": {"enabled": True}})
    msg = resp.choices[0].message
    messages.append(msg.model_dump(exclude_none=True))
    if not msg.tool_calls:
        return 0
    for call in msg.tool_calls:
        result = TOOLS[call.function.name](**json.loads(call.function.arguments))
        messages.append({"role": "tool",
                         "tool_call_id": call.id, "content": result})`;
    const proxyCode =
`def _forward(self):
    path = self.path[3:] if self.path.startswith("/v1") else self.path
    body = self.rfile.read(int(self.headers.get("Content-Length") or 0))
    headers = {k: v for k, v in self.headers.items()
               if k.lower() not in SKIP_REQUEST}
    headers["Authorization"] = f"Bearer {REAL_KEY}"
    started = time.time()
    req = urllib.request.Request(UPSTREAM + path, data=body or None,
                                 headers=headers, method=self.command)
    try:
        with urllib.request.urlopen(req, timeout=300) as r:
            status, resp_headers, data = r.status, r.getheaders(), r.read()
    except urllib.error.HTTPError as e:  # provider errors pass through
        status, resp_headers, data = e.code, e.headers.items(), e.read()
    if LOGGING:
        log_call(started, int((time.time() - started) * 1000),
                 self.headers.get("X-Agent-Id"), self.headers.get("X-Session-Id"),
                 self.command, self.path, status, body, data)
    self.send_response(status)
    for k, v in resp_headers:
        if k.lower() not in SKIP_RESPONSE:
            self.send_header(k, v)
    self.wfile.write(data)`;
    return {
      agent: { name: 'Agent', kicker: 'CLIENT', color: 'var(--agent)', where: 'python3 agent/agent.py', file: 'agent/agent.py',
        role: 'Holds a goal and system prompt, calls the LLM in a loop, runs tools locally and decides when it is done.',
        features: ['goal + system prompt', 'multi-turn loop, max turns', '5 local tools (get_order, …)'],
        config: step === 1
          ? [['LLM_BASE_URL', 'https://openrouter.ai/api/v1', 'Talks to the provider directly'], ['LLM_API_KEY', 'sk-or-… (real key)', 'Falls back to OPENROUTER_API_KEY'], ['LLM_MODEL', 'nvidia/nemotron-3.5-super-vl:free', 'Swappable by config'], ['AGENT_GOAL', 'What will order A-1001 cost…', 'The task'], ['AGENT_MAX_TURNS', '8', 'Stops a runaway loop']]
          : [['LLM_BASE_URL', 'http://127.0.0.1:8080/v1', 'The only change: point at the proxy'], ['LLM_API_KEY', 'dummy', 'The agent never holds the real key'], ['LLM_MODEL', 'nvidia/nemotron-3.5-super-vl:free', 'Unchanged'], ['AGENT_ID', 'support-bot', 'Sent as X-Agent-Id'], ['X-Session-Id', 'uuid4()[:12] per run', 'Generated, not configured']],
        code: code(agentCode, step === 3 ? [1, 2, 3, 4] : []) },
      proxy: { name: 'Proxy', kicker: 'INTERMEDIARY', color: 'var(--proxy)', where: 'python3 proxy/proxy.py', file: 'proxy/proxy.py',
        role: 'Looks exactly like the provider to the agent. Holds the real key. In step 3 it also records every exchange.',
        features: step === 3 ? ['swap key, strip X-* headers', 'pass errors through', 'log each call (on/off)'] : ['swap key, strip X-* headers', 'pass errors through', 'no logging'],
        config: [['OPENROUTER_API_KEY', 'sk-or-… (real key)', 'Only this process has it'], ['UPSTREAM_BASE_URL', 'https://openrouter.ai/api/v1', 'Where to forward'], ['PROXY_HOST / PROXY_PORT', '127.0.0.1 / 8080', 'Where the agent connects']]
          .concat(step === 3 ? [['PROXY_LOGGING', 'on', 'off = step 2 pass-through'], ['PROXY_LOG_DB', 'logs/proxy.db', 'SQLite file']] : [['PROXY_LOGGING', 'off (default)', 'Nothing is recorded']]),
        code: code(step === 3 ? proxyCode : proxyCode.split('\n').filter((l, i) => [6, 14, 15, 16, 17].indexOf(i) < 0).join('\n'), step === 3 ? [7, 15, 16, 17, 18] : []) },
      llm: { name: 'OpenRouter', kicker: 'LLM PROVIDER', color: 'var(--llm)', where: 'openrouter.ai/api/v1', file: 'POST /chat/completions (request shape)',
        role: 'OpenAI-compatible Chat Completions endpoint. Picks a provider for the model and returns a complete answer.',
        features: ['Chat Completions API', 'tool calling + reasoning', 'usage + provider in reply'],
        config: [['endpoint', 'POST /api/v1/chat/completions', 'Non-streaming in steps 1–3'], ['model', 'nvidia/nemotron-3.5-super-vl:free', 'Free tier: 20 req/min, 1,000 req/day'], ['Authorization', step === 1 ? 'Bearer sk-or-… from the agent' : 'Bearer sk-or-… from the proxy', 'Who holds the key']],
        code: code(`{
  "model": "nvidia/nemotron-3.5-super-vl:free",
  "messages": [
    {"role": "system", "content": "You are a small autonomous agent…"},
    {"role": "user", "content": "A customer asks what they will pay…"}
  ],
  "tools": [{"type": "function", "function": {"name": "get_order", …}}],
  "reasoning": {"enabled": true}
}`, []) },
      db: { name: 'Log DB', kicker: 'STORE', color: 'var(--db)', where: 'logs/proxy.db · SQLite', file: 'CREATE TABLE in proxy/proxy.py',
        role: 'A plain SQLite file. One row per call, readable with view_log.py or any SQLite tool.',
        features: ['One row per call: time, agent, session, full request and response, usage, errors'],
        config: [['PROXY_LOG_DB', 'logs/proxy.db', 'Gitignored'], ['view sessions', 'python3 proxy/view_log.py', 'List'], ['view one', 'python3 proxy/view_log.py <session>', 'Turn by turn']],
        code: code(`CREATE TABLE IF NOT EXISTS calls (
    id INTEGER PRIMARY KEY, ts TEXT, duration_ms INTEGER,
    agent TEXT, session TEXT,
    method TEXT, path TEXT, status INTEGER, model TEXT,
    finish_reason TEXT, usage TEXT, error TEXT,
    request TEXT, response TEXT)`, [1, 2, 3, 4, 5, 6, 7]) }
    };
  }

  function nodeBtn(id, e, cur) {
    const active = cur && cur.actor === id;
    return el('button', { type: 'button', class: 'node' + (active ? ' active' : ''), style: state.ent === id ? 'border-color:' + e.color : '',
      'aria-pressed': String(state.ent === id), onclick: () => { state.ent = id; render(); } },
      [el('span', { class: 't' }, [el('i', { style: 'background:' + e.color }), el('span', { text: e.name })]), el('span', { class: 'w', text: e.where })]
        .concat(e.features.map(f => el('span', { class: 'f', text: '· ' + f }))));
  }

  function render() {
    const { step, hop, tab } = state;
    const hs = hops(step), cur = hop >= 0 ? hs[hop] : null, ents = entities(step);
    document.getElementById('steps').replaceChildren(...STEPS.map(s => el('button', { type: 'button', role: 'tab', 'aria-selected': String(s.id === step), text: s.label,
      onclick: () => { clearTimeout(timer); state.step = s.id; state.hop = -1; if (s.id === 1 && (state.ent === 'proxy' || state.ent === 'db')) state.ent = 'agent'; render(); } })));
    document.getElementById('goal').textContent = STEPS[step - 1].goal;
    document.getElementById('caption').className = 'caption' + (cur ? ' on' : '');
    document.getElementById('counter').textContent = (cur ? hop + 1 : '—') + ' / ' + hs.length;
    document.getElementById('captionText').textContent = cur ? cur.text : 'Press Play to simulate one turn, or step through with the arrows. Click any box for its config and code.';
    document.getElementById('playLabel').textContent = hop >= 0 && hop < hs.length - 1 ? 'Restart' : 'Play turn';

    const order = step === 1 ? ['agent', 'llm'] : ['agent', 'proxy', 'llm'];
    const labels = step === 1 ? [{ req: 'POST · Bearer sk-or-…', resp: '200 · full JSON answer' }]
      : [{ req: 'POST · Bearer dummy · X-Agent-Id', resp: 'same status + body' }, { req: 'POST · Bearer sk-or-… (real)', resp: '200 / 4xx · JSON' }];
    const chain = [];
    order.forEach((id, i) => {
      chain.push(nodeBtn(id, ents[id], cur));
      if (i < order.length - 1) {
        const reqOn = cur && cur.link === i && cur.dir === 'req', respOn = cur && cur.link === i && cur.dir === 'resp';
        chain.push(el('div', { class: 'link', 'aria-hidden': 'true' }, [
          el('code', { class: reqOn ? 'on' : '', text: labels[i].req }), el('span', { class: 'bar r' + (reqOn ? ' on' : '') }),
          el('span', { class: 'bar l' + (respOn ? ' on' : '') }), el('code', { class: respOn ? 'on' : '', text: labels[i].resp })]));
      }
    });
    document.getElementById('chain').replaceChildren(...chain);
    const db = document.getElementById('db');
    db.replaceChildren(...(step === 3 ? [el('span', { class: 'stem' + (cur && cur.db ? ' on' : '') }), el('code', { text: 'INSERT INTO calls (redacted)' }), nodeBtn('db', ents.db, cur)] : []));

    const e = ents[state.ent] || ents.agent;
    const side = document.getElementById('side');
    side.replaceChildren(
      el('span', { class: 'k', style: 'color:' + e.color, text: e.kicker }), el('h2', { text: e.name }), el('p', { text: e.role }),
      el('div', { class: 'seg', role: 'tablist', 'aria-label': 'Detail' }, [
        el('button', { type: 'button', role: 'tab', 'aria-selected': String(tab === 'cfg'), text: 'Config', onclick: () => { state.tab = 'cfg'; render(); } }),
        el('button', { type: 'button', role: 'tab', 'aria-selected': String(tab === 'code'), text: 'Key code', onclick: () => { state.tab = 'code'; render(); } })]));
    if (tab === 'cfg') e.config.forEach(c => side.appendChild(el('div', { class: 'cfg' }, [el('b', { text: c[0] }), el('code', { text: c[1] }), el('span', { text: c[2] })])));
    else {
      side.append(el('span', { class: 'file', text: e.file }),
        el('div', { class: 'code' }, e.code.map(l => el('div', { class: 'ln' + (l.add ? ' add' : '') }, [el('span', { text: l.n }), el('span', { text: l.add ? '+' : '' }), el('span', { text: l.t })]))),
        el('span', { class: 'hint', text: '+ marks lines added in this step' }));
    }
  }

  document.getElementById('play').addEventListener('click', () => {
    clearTimeout(timer);
    const n = hops(state.step).length;
    const tick = i => { state.hop = i; render(); if (i < n - 1) timer = setTimeout(() => tick(i + 1), SPEED); };
    tick(0);
  });
  document.getElementById('next').addEventListener('click', () => { clearTimeout(timer); state.hop = Math.min(hops(state.step).length - 1, state.hop + 1); render(); });
  document.getElementById('prev').addEventListener('click', () => { clearTimeout(timer); state.hop = Math.max(-1, state.hop - 1); render(); });
  render();
})();
</script>
