<title>Proxy Session Sequence</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: lane diagram (agent · proxy · provider · log) on the left, hop inspector on the right; stacks on phones. */
:root {
  --bg: #FFFFFF; --panel: #F7F8FA; --fg: #15171C; --muted: #5B6270; --line: #E3E5EA; --rail: #D5D9E0;
  --sel: #EEF3FF; --chip-sel: #F2F6FF; --code-bg: #15171C; --code-fg: #E6E8EC;
  --agent: #2457D6; --proxy: #6B3FB5; --llm: #0F6B4F; --db: #8A4B00; --err: #C2261B;
  --note-bg: #FFF4E0; --note-fg: #6B3A00;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121419; --panel: #1A1D24; --fg: #E8EAEF; --muted: #9AA1AE; --line: #2A2E37; --rail: #343944;
  --sel: #1C2740; --chip-sel: #1C2740; --code-bg: #0B0C10; --code-fg: #DDE1E8;
  --agent: #7FA2FF; --proxy: #B89AF0; --llm: #4FC79F; --db: #E3A15A; --err: #FF7A6E;
  --note-bg: #3A2A10; --note-fg: #F5C98A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121419; --panel: #1A1D24; --fg: #E8EAEF; --muted: #9AA1AE; --line: #2A2E37; --rail: #343944;
  --sel: #1C2740; --chip-sel: #1C2740; --code-bg: #0B0C10; --code-fg: #DDE1E8;
  --agent: #7FA2FF; --proxy: #B89AF0; --llm: #4FC79F; --db: #E3A15A; --err: #FF7A6E;
  --note-bg: #3A2A10; --note-fg: #F5C98A; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); margin: 0 }
button { font: inherit; cursor: pointer; color: inherit }
button:focus-visible { outline: 2px solid var(--agent); outline-offset: 2px }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding-block: 14px; border-bottom: 1px solid var(--line) }
header h1 { margin: 0; font-size: 17px; font-weight: 700 }
header .sub { font-size: 13px; color: var(--muted) }
.sessions { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto }
.chip { border: 1px solid var(--rail); background: var(--bg); border-radius: 999px; padding: 6px 12px; min-height: 36px; font-size: 13px; display: inline-flex; gap: 8px; align-items: center }
.chip[aria-selected="true"] { border-color: var(--agent); background: var(--chip-sel) }
.chip b { font-weight: 600 }
.chip code { font-family: var(--mono); font-size: 12px; color: var(--muted) }
.dot { width: 8px; height: 8px; border-radius: 4px; background: var(--err) }
.layout { display: flex; flex-wrap: wrap; align-items: flex-start }
main { flex: 999 1 640px; min-width: 0; padding-bottom: 24px; overflow-x: auto }
.lanes, .rows { min-width: 640px }
.lanes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); padding-block: 16px 12px; z-index: 2 }
.lane { display: flex; flex-direction: column; align-items: center; gap: 4px }
.lane span:first-child { border: 2px solid; border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: 14px; background: var(--bg) }
.lane span:last-child { font-size: 12px; color: var(--muted) }
.divider { display: flex; align-items: center; gap: 10px; padding-block: 14px 6px }
.divider b { font-size: 12px; letter-spacing: .06em; color: var(--muted) }
.divider i { flex: 1; height: 1px; background: var(--line) }
.divider code { font-family: var(--mono); font-size: 12px; color: var(--muted) }
.hop { position: relative; height: 52px; border: none; padding: 0; background: transparent; border-radius: 8px; width: 100%; display: block }
.hop[aria-pressed="true"] { background: var(--sel) }
.hop .rail { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--rail) }
.hop .lbl, .hop .sub { position: absolute; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.hop .lbl { top: 6px; font-size: 12px; font-weight: 600 }
.hop .sub { top: 35px; font-family: var(--mono); font-size: 11px; color: var(--muted) }
.hop .shaft { position: absolute; top: 30px; height: 2px }
.hop .head { position: absolute; top: 25px; width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent }
.hop .self { position: absolute; left: calc(12.5% + 8px); top: 10px; border: 1.5px solid var(--agent); color: var(--agent); background: var(--bg); border-radius: 8px; padding: 6px 10px; font-family: var(--mono); font-size: 12px; white-space: nowrap; max-width: calc(87.5% - 16px); overflow: hidden; text-overflow: ellipsis }
aside { flex: 1 1 380px; min-width: 0; border-left: 1px solid var(--line); background: var(--panel); padding: 18px; display: flex; flex-direction: column; gap: 12px; align-self: stretch }
aside .kicker { font-size: 12px; font-weight: 700; letter-spacing: .06em }
aside h2 { margin: 0; font-size: 18px; text-wrap: balance }
aside p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.5 }
aside .note { font-size: 12px; color: var(--note-fg); background: var(--note-bg); border-radius: 6px; padding: 6px 10px }
.fields { display: flex; flex-direction: column; gap: 6px }
.field { display: flex; gap: 10px; font-size: 13px; border-bottom: 1px solid var(--line); padding-bottom: 6px }
.field span:first-child { flex: 0 0 130px; color: var(--muted) }
.field span:last-child { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12px; word-break: break-word }
.rawbar { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600 }
.rawbar button { border: 1px solid var(--rail); background: var(--bg); border-radius: 6px; padding: 6px 10px; min-height: 32px; font-size: 12px }
pre { margin: 0; background: var(--code-bg); color: var(--code-fg); border-radius: 8px; padding: 12px; font-family: var(--mono); font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto }
pre.open { max-height: none }
.empty { padding: 40px 0; color: var(--muted) }
@media (max-width: 720px) { aside { border-left: none; border-top: 1px solid var(--line) } }
</style>

<header class="wrap">
  <h1>Proxy Session Sequence</h1>
  <span class="sub">Lesson 3 · every hop of a logged conversation</span>
  <div class="sessions" role="tablist" aria-label="Session" id="sessions"></div>
</header>
<div class="layout">
  <main class="wrap">
    <div class="lanes" id="lanes"></div>
    <div class="rows" id="rows"></div>
  </main>
  <aside aria-label="Hop details" id="detail"></aside>
</div>

<script>
(function () {
  const calls = JSON.parse(document.getElementById('log-data').textContent);
  const lanes = [
    { name: 'Agent', sub: 'client · OpenAI SDK', color: 'var(--agent)' },
    { name: 'Proxy', sub: '127.0.0.1:8080', color: 'var(--proxy)' },
    { name: 'OpenRouter', sub: 'LLM provider', color: 'var(--llm)' },
    { name: 'Log DB', sub: 'logs/proxy.db', color: 'var(--db)' }
  ];
  const cx = [12.5, 37.5, 62.5, 87.5];
  const state = { sel: null, hop: '0:0', rawOpen: false };
  const el = (tag, attrs, kids) => {
    const n = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (k === 'style') n.style.cssText = v; else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
    });
    (kids || []).forEach(c => c && n.appendChild(c));
    return n;
  };

  function sessions() {
    const m = new Map();
    calls.forEach(c => {
      const k = c.session || '(none)';
      if (!m.has(k)) m.set(k, { id: k, agent: c.agent || 'unknown', calls: [], errors: 0 });
      m.get(k).calls.push(c);
      if (c.error) m.get(k).errors++;
    });
    return Array.from(m.values());
  }

  function hopsFor(s) {
    const names = {};
    s.calls.forEach(c => {
      const m = c.response && c.response.choices && c.response.choices[0].message;
      ((m && m.tool_calls) || []).forEach(t => { names[t.id] = t.function.name; });
    });
    const out = [];
    s.calls.forEach((c, i) => {
      const msgs = (c.request && c.request.messages) || [];
      const prevLen = i > 0 ? ((s.calls[i - 1].request.messages || []).length + 1) : 0;
      const fresh = msgs.slice(prevLen);
      const u = c.usage || {};
      const msg = !c.error && c.response && c.response.choices ? c.response.choices[0].message : null;
      const route = c.route ? [['gateway route', c.route + (c.upstream_model && c.upstream_model !== c.model ? ' → ' + c.upstream_model : '')]] : [];
      out.push({ divider: true, label: 'CALL ' + (i + 1), sub: c.ts.slice(11, 19) + ' UTC · ' + c.duration_ms + ' ms' });
      const list = [
        { from: 0, to: 1, label: 'POST /v1/chat/completions', sub: msgs.length + ' msgs (+' + fresh.length + ' new) · Bearer dummy',
          kicker: 'AGENT → PROXY', title: 'Request leaves the agent',
          desc: 'The agent sends the whole conversation so far. Only the messages added since the last call are new.',
          fields: [['model', c.model], ['messages', msgs.length], ['new this call', fresh.map(m => m.role + (m.role === 'tool' ? ' (' + (names[m.tool_call_id] || '?') + ')' : '')).join(', ') || '—'], ['tools offered', ((c.request && c.request.tools) || []).length], ['X-Agent-Id', c.agent || '—'], ['X-Session-Id', c.session || '—']],
          rawLabel: 'Request body', raw: c.request },
        { from: 1, to: 2, label: 'forward', sub: 'Authorization swapped · X-* headers removed',
          kicker: 'PROXY → OPENROUTER', title: 'Proxy forwards to the provider', derived: true,
          desc: "Same body, byte for byte. The proxy replaces the agent's key with the real one and strips the identity headers.",
          fields: [['Authorization', 'Bearer dummy → Bearer [real key]'], ['X-Agent-Id', 'removed', 'err'], ['X-Session-Id', 'removed', 'err'], ['URL', 'https://openrouter.ai/api/v1' + c.path.replace(/^\/v1/, '')], ['body', 'unchanged']].concat(route) },
        { from: 2, to: 1, err: !!c.error, label: c.error ? c.status + ' error' : c.status + ' · ' + (c.finish_reason || ''),
          sub: c.error ? (c.error.message || '') : ((u.total_tokens || 0) + ' tok · ' + ((c.response && c.response.provider) || '')),
          kicker: 'OPENROUTER → PROXY', title: c.error ? 'Provider returned an error' : 'Provider answers',
          desc: c.error ? 'The error body is passed back to the agent untouched.' : 'Complete, non-streamed answer with usage accounting.',
          fields: c.error ? [['status', c.status, 'err'], ['message', c.error.message || '', 'err']]
            : [['finish_reason', c.finish_reason], ['prompt tokens', u.prompt_tokens], ['completion tokens', u.completion_tokens], ['reasoning tokens', (u.completion_tokens_details || {}).reasoning_tokens], ['tool calls', ((msg && msg.tool_calls) || []).map(t => t.function.name).join(', ') || 'none']],
          rawLabel: 'Response body', raw: c.response },
        { from: 1, to: 3, label: 'INSERT INTO calls', sub: 'row ' + c.id + ' · secrets redacted',
          kicker: 'PROXY → LOG DB', title: 'One row written to the log',
          desc: 'Written after the answer arrives. If the write fails the agent still gets its reply.',
          fields: [['id', c.id], ['ts', c.ts], ['duration_ms', c.duration_ms], ['agent / session', (c.agent || '—') + ' / ' + (c.session || '—')], ['status', c.status], ['finish_reason', c.finish_reason || '—'], ['usage', c.usage ? c.usage.total_tokens + ' total tokens' : '—']],
          rawLabel: 'Stored row (request/response columns trimmed)',
          raw: { id: c.id, ts: c.ts, duration_ms: c.duration_ms, agent: c.agent, session: c.session, method: c.method, path: c.path, status: c.status, model: c.model, finish_reason: c.finish_reason, usage: c.usage, error: c.error, request: '…', response: '…' } },
        { from: 1, to: 0, label: c.status + ' returned as-is', sub: 'same status, headers, body',
          kicker: 'PROXY → AGENT', title: 'Answer delivered to the agent',
          desc: 'The agent cannot tell this answer came through a proxy.',
          fields: [['status', c.status], ['body', 'identical to provider response']] }
      ];
      const next = s.calls[i + 1];
      ((msg && msg.tool_calls) || []).forEach(t => {
        const res = next ? ((next.request.messages || []).find(m => m.tool_call_id === t.id) || {}).content : '(run ended)';
        list.push({ self: true, label: 'runs ' + t.function.name + '(' + t.function.arguments + ')',
          kicker: 'AGENT · LOCAL TOOL', title: 'Agent executes ' + t.function.name,
          desc: 'Runs inside the agent process. The proxy never sees this step, only its result in the next request.',
          fields: [['arguments', t.function.arguments], ['result', res || '—'], ['tool_call_id', t.id]] });
      });
      list.forEach((h, j) => out.push(Object.assign(h, { key: i + ':' + j })));
    });
    return out;
  }

  function render() {
    const all = sessions();
    const sesBox = document.getElementById('sessions'), rowsBox = document.getElementById('rows'), detail = document.getElementById('detail');
    sesBox.replaceChildren(); rowsBox.replaceChildren(); detail.replaceChildren();
    document.getElementById('lanes').replaceChildren(...lanes.map(l => el('div', { class: 'lane' }, [
      el('span', { style: 'border-color:' + l.color + ';color:' + l.color, text: l.name }), el('span', { text: l.sub })])));
    if (!all.length) { rowsBox.appendChild(el('p', { class: 'empty', text: 'No calls in this snapshot. Run the agent with PROXY_LOGGING=on, then viz/embed_log.py.' })); return; }
    const s = all.find(x => x.id === state.sel) || all[0];
    all.forEach(x => sesBox.appendChild(el('button', { type: 'button', role: 'tab', class: 'chip', 'aria-selected': String(x.id === s.id),
      onclick: () => { state.sel = x.id; state.hop = '0:0'; render(); } },
      [el('b', { text: x.agent }), el('code', { text: x.id }), x.errors ? el('span', { class: 'dot', 'aria-label': 'has errors' }) : null])));
    const hops = hopsFor(s);
    let current = null;
    hops.forEach(h => {
      if (h.divider) { rowsBox.appendChild(el('div', { class: 'divider' }, [el('b', { text: h.label }), el('i'), el('code', { text: h.sub })])); return; }
      const col = h.err ? 'var(--err)' : h.self ? 'var(--agent)' : lanes[h.from].color;
      const kids = cx.map(x => el('span', { class: 'rail', style: 'left:' + x + '%' }));
      if (h.self) kids.push(el('span', { class: 'self', text: h.label }));
      else {
        const a = cx[h.from], b = cx[h.to], left = Math.min(a, b), width = Math.abs(a - b), right = b > a;
        const box = 'left:' + left + '%;width:' + width + '%';
        kids.push(el('span', { class: 'lbl', style: box, text: h.label }));
        kids.push(el('span', { class: 'shaft', style: box + ';background:' + col }));
        kids.push(el('span', { class: 'head', style: (right ? 'left:calc(' + b + '% - 10px);border-left:10px solid ' + col : 'left:' + b + '%;border-right:10px solid ' + col) }));
        kids.push(el('span', { class: 'sub', style: box, text: h.sub || '' }));
      }
      if (h.key === state.hop) current = h;
      rowsBox.appendChild(el('button', { type: 'button', class: 'hop', 'aria-pressed': String(h.key === state.hop), 'aria-label': h.kicker + ': ' + h.label,
        onclick: () => { state.hop = h.key; render(); } }, kids));
    });
    const d = current || hops.find(h => !h.divider);
    const kc = d.self ? 'var(--agent)' : lanes[d.from].color;
    detail.append(el('span', { class: 'kicker', style: 'color:' + kc, text: d.kicker }), el('h2', { text: d.title }), el('p', { text: d.desc }));
    if (d.derived) detail.appendChild(el('p', { class: 'note', text: "Not stored in the log: reconstructed from the proxy's rules." }));
    detail.appendChild(el('div', { class: 'fields' }, d.fields.map(f => el('div', { class: 'field' }, [
      el('span', { text: f[0] }), el('span', { text: f[1] == null ? '—' : String(f[1]), style: f[2] === 'err' ? 'color:var(--err)' : '' })]))));
    if (d.raw) {
      detail.appendChild(el('div', { class: 'rawbar' }, [el('span', { text: d.rawLabel }),
        el('button', { type: 'button', text: state.rawOpen ? 'Collapse' : 'Expand', onclick: () => { state.rawOpen = !state.rawOpen; render(); } })]));
      detail.appendChild(el('pre', { class: state.rawOpen ? 'open' : '', text: JSON.stringify(d.raw, null, 2) }));
    }
  }
  render();
})();
</script>
